{en:"Broselow tape",fr:"ruban de Broselow",note:"weight estimation by height for drug dosing in emergencies"},
{en:"meningococcal septicaemia",fr:"méningococcémie",note:"non-blanching petechiae/purpura + septic shock; IV benzylpenicillin/ceftriaxone immediately"},
{en:"status epilepticus in children",fr:"état de mal épileptique chez l'enfant",note:"seizure >5 min or repeated seizures without recovery; IV/IM/buccal midazolam 0.3mg/kg first"},
{en:"epiglottitis",fr:"épiglottite",note:"H.influenzae type b (rare post-Hib vaccine); drooling/tripod position/stridor; do NOT examine throat; IV ceftriaxone"},
{en:"PICU (paediatric intensive care unit)",fr:"USIN pédiatrique / réanimation pédiatrique"},
{en:"NICU (neonatal intensive care unit)",fr:"unité de soins intensifs néonatals (USIN)"},
{en:"meningitis (bacterial)",fr:"méningite bactérienne",note:"fever + neck stiffness + photophobia + Kernig/Brudzinski signs; LP urgently; IV ceftriaxone + dexamethasone"},
]},

{id:"senses", label:"Senses", icon:"👁️", items:[
// === VISION — ASSESSMENT ===
{en:"visual acuity (VA)",fr:"acuité visuelle (AV)",note:"Snellen chart (6/6 normal) or LogMAR (0.0 normal); distance + near"},
{en:"Snellen chart",fr:"échelle de Snellen",note:"6/6 (UK) = 20/20 (US) = normal VA; results at 6 metres"},
{en:"LogMAR chart (ETDRS)",fr:"échelle LogMAR (ETDRS)",note:"logarithm of minimum angle of resolution; preferred in research"},
{en:"pinhole test",fr:"test du sténopé",note:"improves VA if refractive error; no improvement suggests media opacity"},
{en:"visual field",fr:"champ visuel",note:"confrontation testing; formal Humphrey/Goldmann perimetry"},
{en:"colour vision",fr:"vision des couleurs",note:"Ishihara plates; deficiency common in X-linked red-green; acquired in optic neuritis"},
{en:"intraocular pressure (IOP)",fr:"pression intraoculaire (PIO)",note:"normal 10–21 mmHg; elevated in glaucoma; tonometry (Goldmann applanation / non-contact)"},
{en:"fundoscopy / ophthalmoscopy",fr:"fond d'œil / ophtalmoscopie",note:"optic disc / cup-disc ratio / retinal vessels / macula; dilated preferred"},
{en:"slit-lamp examination",fr:"examen à la lampe à fente",note:"anterior segment (cornea/lens/iris/anterior chamber)"},
{en:"fluorescein angiography",fr:"angiographie à la fluorescéine",note:"retinal vasculature; NV/leakage in AMD/DR"},
{en:"optical coherence tomography (OCT)",fr:"tomographie par cohérence optique (OCT)",note:"macular thickness/drusen/RNFL in glaucoma"},
// === VISION — CONDITIONS ===
{en:"photophobia",fr:"photophobie",note:"light sensitivity; meningitis/uveitis/migraine/corneal disease"},
{en:"diplopia (double vision)",fr:"diplopie (vision double)",note:"monocular vs binocular; 3rd/4th/6th CN palsy; thyroid eye disease"},
{en:"blurred vision",fr:"vision floue",note:"refractive error / cataract / vitreous floaters / papilloedema"},
{en:"cataract",fr:"cataracte",note:"lens opacity; nuclear/cortical/posterior subcapsular; phacoemulsification + IOL"},
{en:"glaucoma (open-angle)",fr:"glaucome à angle ouvert",note:"most common; elevated IOP + optic nerve damage + visual field loss; prostaglandin analogues first-line"},
{en:"glaucoma (acute angle-closure)",fr:"glaucome aigu par fermeture de l'angle",note:"emergency; painful red eye + halos + raised IOP + nausea; IV acetazolamide + pilocarpine + laser iridotomy"},
{en:"age-related macular degeneration (AMD)",fr:"dégénérescence maculaire liée à l'âge (DMLA)",note:"dry (drusen/geographic atrophy) vs wet (NV membrane/subretinal fluid); anti-VEGF for wet AMD"},
{en:"diabetic retinopathy",fr:"rétinopathie diabétique",note:"NPDR (microaneurysms/haemorrhages) → PDR (neovascularisation/vitreous haem); laser/anti-VEGF/vitrectomy"},
{en:"hypertensive retinopathy",fr:"rétinopathie hypertensive",note:"AV nicking / cotton wool spots / flame haemorrhages / papilloedema; Keith-Wagener-Barker grading"},
{en:"retinal detachment",fr:"décollement de la rétine",note:"flashes + floaters + curtain defect; rhegmatogenous most common; laser/cryotherapy/vitrectomy; ophthalmic emergency"},
{en:"retinal artery occlusion (CRAO/BRAO)",fr:"occlusion de l'artère centrale/branche rétinienne",note:"sudden painless visual loss; cherry-red spot (CRAO); treat as TIA/stroke workup"},
{en:"retinal vein occlusion (CRVO/BRVO)",fr:"occlusion veineuse centrale/branche rétinienne",note:"flame haemorrhages in all quadrants (CRVO); anti-VEGF for macular oedema"},
{en:"uveitis (iritis/iridocyclitis/panuveitis)",fr:"uvéite (iritis / iridocyclite / panuvéite)",note:"anterior: HLA-B27 / ankylosing spondylitis / sarcoidosis; topical steroids + mydriatics"},
{en:"corneal ulcer / keratitis",fr:"ulcère cornéen / kératite",note:"fluorescein staining; bacterial (contact lens risk) → topical fluoroquinolone; viral HSV → aciclovir"},
{en:"conjunctivitis",fr:"conjonctivite",note:"bacterial (mucopurulent) / viral adenovirus (watery/epidemic) / allergic (itchy); chloramphenicol drops if bacterial"},
{en:"blepharitis",fr:"blépharite",note:"lid margin inflammation; staphylococcal; lid hygiene + warm compresses"},
{en:"chalazion / stye",fr:"chalazion / orgelet",note:"chalazion: meibomian gland cyst (not infected); stye: infected eyelash follicle; warm compress; I&D if persistent"},
{en:"ptosis",fr:"ptosis (chute de la paupière)",note:"congenital / 3rd CN palsy / Horner syndrome / myasthenia gravis"},
{en:"strabismus (squint)",fr:"strabisme",note:"esotropia/exotropia/hypertropia; cover test; patching/surgery/prisms"},
{en:"amblyopia (lazy eye)",fr:"amblyopie (œil paresseux)",note:"reduced VA in structurally normal eye; stimulus deprivation/strabismic/refractive; patching critical in childhood"},
{en:"nystagmus",fr:"nystagmus",note:"involuntary rhythmic eye movement; jerk/pendular; cerebellar/vestibular/congenital"},
{en:"papilloedema",fr:"œdème papillaire",note:"optic disc swelling from raised ICP; bilateral; urgent CT/LP"},
{en:"optic neuritis",fr:"névrite optique",note:"pain on eye movement + visual loss; demyelination (MS); IV methylprednisolone"},
// === OPHTHALMIC DRUGS ===
{en:"prostaglandin analogues (latanoprost)",fr:"analogues de la prostaglandine (latanoprost)",note:"first-line glaucoma; reduce IOP by increasing uveoscleral outflow; once daily"},
{en:"beta-blockers (timolol eye drops)",fr:"bêta-bloquants (timolol collyre)",note:"reduce aqueous humour production; CI: asthma/bradycardia"},
{en:"carbonic anhydrase inhibitors (dorzolamide/acetazolamide)",fr:"inhibiteurs de l'anhydrase carbonique",note:"reduce aqueous production; systemic acetazolamide for acute glaucoma"},
{en:"alpha-2 agonists (brimonidine)",fr:"agonistes alpha-2 (brimonidine)",note:"reduce aqueous + increase uveoscleral outflow; glaucoma adjunct"},
{en:"anti-VEGF (ranibizumab/bevacizumab/aflibercept)",fr:"anti-VEGF (ranibizumab/bevacizumab/aflibercept)",note:"intravitreal injection; wet AMD/DMO/CRVO; monthly loading then PRN"},
{en:"mydriatics (tropicamide/cyclopentolate)",fr:"mydriatiques (tropicamide/cyclopentolate)",note:"dilate pupil for fundoscopy; cyclopentolate also cycloplegic"},
{en:"miotics (pilocarpine)",fr:"myotiques (pilocarpine)",note:"constrict pupil; acute angle-closure glaucoma; CI open-angle"},
// === EAR / HEARING ===
{en:"pure-tone audiometry",fr:"audiométrie tonale",note:"hearing threshold by frequency (250–8000Hz); air + bone conduction; audiogram"},
{en:"tympanometry",fr:"tympanométrie",note:"middle ear pressure/compliance; type A (normal) / B (effusion/perforation) / C (ETD)"},
{en:"otoacoustic emissions (OAE)",fr:"otoémissions acoustiques (OEA)",note:"newborn hearing screening; cochlear hair cell function"},
{en:"brainstem evoked response audiometry (BERA/ABR)",fr:"potentiels évoqués auditifs du tronc cérébral (PEATC/ABR)",note:"auditory neural pathway; neonates + uncooperative patients; acoustic neuroma"},
{en:"conductive hearing loss",fr:"surdité de transmission",note:"outer/middle ear problem; air-bone gap on audiogram; causes: wax/OM/otosclerosis/perforation"},
{en:"sensorineural hearing loss (SNHL)",fr:"surdité de perception",note:"cochlear or neural; no air-bone gap; presbycusis/noise/ototoxicity/genetic"},
{en:"mixed hearing loss",fr:"surdité mixte",note:"combined conductive + sensorineural components"},
{en:"hearing loss grading",fr:"classification de la perte auditive",note:"mild 26–40dB / moderate 41–55dB / moderately severe 56–70dB / severe 71–90dB / profound >90dB"},
{en:"presbycusis",fr:"presbyacousie",note:"age-related bilateral SNHL; high-frequency first; symmetrical"},
{en:"noise-induced hearing loss",fr:"surdité due au bruit",note:"occupational/recreational; 4kHz notch on audiogram; NIHL; irreversible"},
{en:"ototoxicity",fr:"ototoxicité",note:"aminoglycosides (gentamicin) / cisplatin / loop diuretics / quinine; monitor TDM"},
{en:"otosclerosis",fr:"otospongiose",note:"stapes fixation; conductive HL + tinnitus; Schwartz sign; stapedectomy"},
{en:"cholesteatoma",fr:"cholestéatome",note:"keratinous cyst in middle ear; erosion of ossicles/mastoid; surgery (mastoidectomy)"},
{en:"tinnitus",fr:"acouphènes",note:"subjective noise perception; pulsatile (vascular) vs non-pulsatile; CBT/TRT/masking"},
{en:"otitis media (acute/chronic/with effusion)",fr:"otite moyenne (aiguë/chronique/séreuse)",note:"AOM: bacterial; glue ear (OME): effusion/conductive HL in children; grommets"},
{en:"otitis externa (swimmer's ear)",fr:"otite externe",note:"canal inflammation; Pseudomonas/Staph; acetic acid + steroid drops; malignant OE in diabetics → Pseudomonas IV"},
{en:"hearing aid",fr:"appareillage auditif / aide auditive",note:"BTE/RIC/ITE; digital; trial period; audiologist fitting"},
{en:"cochlear implant",fr:"implant cochléaire",note:"severe-profound SNHL; electrode array in cochlea; direct auditory nerve stimulation"},
// === VESTIBULAR / BALANCE ===
{en:"BPPV (benign paroxysmal positional vertigo)",fr:"vertige paroxystique positionnel bénin (VPPB)",note:"canalithiasis; posterior canal most common; Dix-Hallpike test; Epley manoeuvre"},
{en:"Ménière's disease",fr:"maladie de Ménière",note:"endolymphatic hydrops; triad: episodic vertigo + SNHL + tinnitus; betahistine/diuretics"},
{en:"vestibular neuritis",fr:"névrite vestibulaire",note:"acute sustained vertigo; post-viral; no hearing loss; prochlorperazine; vestibular rehabilitation"},
{en:"labyrinthitis",fr:"labyrinthite",note:"vestibular neuritis + SNHL; viral/bacterial; if bacterial → IV antibiotics"},
{en:"Dix-Hallpike test",fr:"manœuvre de Dix-Hallpike",note:"diagnosis of posterior canal BPPV; nystagmus + vertigo on positioning"},
{en:"Epley manoeuvre",fr:"manœuvre d'Epley",note:"canalith repositioning; treats posterior canal BPPV; >80% effective"},
// === NOSE / SMELL ===
{en:"anosmia",fr:"anosmie",note:"loss of smell; COVID-19/head trauma/nasal polyps/viral URI; post-COVID anosmia may persist"},
{en:"hyposmia / parosmia",fr:"hyposmie / parosmie",note:"reduced / distorted smell; post-viral / head trauma"},
{en:"epistaxis (nosebleed)",fr:"épistaxis",note:"Kiesselbach's plexus (Little's area) anterior most common; direct pressure/cautery; BIPP packing if severe"},
{en:"rhinitis (allergic/vasomotor)",fr:"rhinite (allergique / vasomotrice)",note:"allergic: seasonal/perennial; intranasal steroids first-line; antihistamines; SCIT"},
{en:"sinusitis (acute/chronic)",fr:"sinusite (aiguë / chronique)",note:"maxillary most common; viral > bacterial; amoxicillin if bacterial criteria; nasal steroids for chronic"},
{en:"nasal polyps",fr:"polypes nasaux",note:"non-allergic eosinophilic; associated with asthma + aspirin sensitivity (Samter's triad); FESS"},
// === TASTE ===
{en:"ageusia / dysgeusia",fr:"agueusie / dysgueusie",note:"loss/alteration of taste; COVID-19/zinc deficiency/drug side effects/radiation"},
// === THROAT / LARYNX ===
{en:"laryngoscopy",fr:"laryngoscopie",note:"indirect mirror / direct rigid / flexible nasolaryngoscopy; vocal cord assessment"},
{en:"vocal cord palsy",fr:"paralysie des cordes vocales",note:"unilateral: hoarseness; bilateral: stridor/dyspnoea; RLN palsy → thyroid surgery/malignancy"},
{en:"epiglottitis",fr:"épiglottite",note:"H.influenzae type b (pre-vaccine) or Streptococcus; drooling/tripod/stridor; do not examine; IV ceftriaxone"},
// === ENT PROCEDURES ===
{en:"myringotomy + grommets (ventilation tubes)",fr:"paracentèse + aérateurs transtympaniques (ATT)",note:"glue ear in children; equalises middle ear pressure; spontaneous extrusion after 6–12 months"},
{en:"functional endoscopic sinus surgery (FESS)",fr:"chirurgie endoscopique fonctionnelle des sinus",note:"chronic sinusitis/polyps; under GA; endoscopic approach"},
{en:"septoplasty",fr:"septoplastie",note:"deviated nasal septum correction; functional breathing improvement"},
{en:"tonsillectomy",fr:"amygdalectomie",note:"Paradise criteria / recurrent AOM / obstructive sleep apnoea; post-op haemorrhage risk"},
{en:"adenoidectomy",fr:"adénoïdectomie",note:"hypertrophied adenoids; OME + nasal obstruction in children; often with grommets"},
{en:"microlaryngoscopy",fr:"microlaryngoscopie",note:"vocal cord polyp/nodule/granuloma biopsy or excision; under GA; direct laryngoscope + microscope"},
]},

{id:"disability", label:"Disability", icon:"♿", items:[
// === CLASSIFICATION ===
{en:"ICF (International Classification of Functioning, Disability and Health)",fr:"CIF (Classification internationale du fonctionnement, du handicap et de la santé)",note:"WHO; body functions+structures / activity / participation / environmental factors"},
{en:"impairment",fr:"déficience",note:"loss or abnormality of body structure or function (ICF)"},
{en:"activity limitation",fr:"limitation d'activité",note:"difficulty executing tasks (ICF)"},
{en:"participation restriction",fr:"restriction de participation",note:"problems in life situations (ICF)"},
{en:"physical disability",fr:"handicap physique / moteur"},
{en:"cognitive disability",fr:"handicap cognitif"},
{en:"sensory disability",fr:"handicap sensoriel"},
{en:"intellectual disability",fr:"déficience intellectuelle",note:"IQ <70 + adaptive behaviour deficit; mild/moderate/severe/profound"},
{en:"acquired disability",fr:"handicap acquis",note:"post-injury/illness; vs congenital"},
{en:"congenital disability",fr:"handicap congénital"},
{en:"RQTH (reconnaissance qualité de travailleur handicapé)",fr:"RQTH",note:"French legal recognition of disabled worker status; MDPH"},
{en:"MDPH (Maison Départementale des Personnes Handicapées)",fr:"MDPH",note:"French disability administration; AAH/PCH/RQTH/carte mobilité inclusion"},
// === NEUROLOGICAL DISABILITY ===
{en:"hemiplegia",fr:"hémiplégie",note:"unilateral paralysis; stroke most common cause; upper motor neuron signs"},
{en:"hemiparesis",fr:"hémiparésie",note:"partial/incomplete unilateral weakness"},
{en:"paraplegia",fr:"paraplégie",note:"lower limb paralysis; T1–L1 spinal cord lesion"},
{en:"tetraplegia / quadriplegia",fr:"tétraplégie",note:"all four limbs; C1–C8 spinal cord injury; C3–C5 phrenic nerve → ventilatory support"},
{en:"ASIA Impairment Scale",fr:"échelle ASIA",note:"A: complete / B: incomplete sensory / C: motor <grade 3 / D: motor ≥grade 3 / E: normal; spinal cord injury"},
{en:"spasticity",fr:"spasticité",note:"velocity-dependent increased tone; Modified Ashworth Scale 0–4; baclofen/botulinum toxin"},
{en:"Modified Ashworth Scale (MAS)",fr:"échelle d'Ashworth modifiée",note:"muscle tone 0–4; 0=normal / 1=slight increase / 1+=more marked / 2=considerable / 3=passive movement difficult / 4=rigid"},
{en:"flaccid paralysis",fr:"paralysie flasque",note:"lower motor neuron; reduced tone; atrophy; areflexia"},
{en:"spinal cord injury (SCI)",fr:"lésion médullaire",note:"complete vs incomplete; dermatome/myotome level; pressure care/autonomic dysreflexia"},
{en:"autonomic dysreflexia",fr:"dysréflexie autonome",note:"SCI T6 and above; massive sympathetic response to stimuli below lesion; hypertensive emergency; sit up + remove stimulus"},
{en:"multiple sclerosis (MS)",fr:"sclérose en plaques (SEP)",note:"relapsing-remitting most common; EDSS 0–10; DMTs (interferon/natalizumab/ocrelizumab)"},
{en:"EDSS (Expanded Disability Status Scale)",fr:"EDSS (score étendu d'incapacité)",note:"MS-specific; 0–10; 6=walking aid required; ≥7=wheelchair"},
{en:"cerebral palsy",fr:"paralysie cérébrale (IMC/IMOC)",note:"spastic (70%) / dyskinetic / ataxic; GMFCS I–V; MACS for hand function"},
{en:"GMFCS (Gross Motor Function Classification System)",fr:"GMFCS",note:"cerebral palsy I–V; I=walks without limitations / V=transported in manual wheelchair"},
{en:"Fugl-Meyer Assessment",fr:"évaluation de Fugl-Meyer",note:"post-stroke motor/sensory function; upper limb (66 points) + lower limb (34 points)"},
// === ASSESSMENT SCALES ===
{en:"Barthel Index (BI)",fr:"indice de Barthel",note:"10 ADL items 0–100; independence score; stroke/rehabilitation"},
{en:"FIM (Functional Independence Measure)",fr:"MIF (mesure d'indépendance fonctionnelle)",note:"18 items motor+cognitive; 1–7 scoring; total 18–126; widely used in rehab"},
{en:"Modified Rankin Scale (mRS)",fr:"échelle de Rankin modifiée",note:"stroke outcome; 0=no symptoms / 3=moderate disability / 5=severe / 6=death; mRS ≤2 = favourable"},
{en:"Lawton IADL Scale",fr:"échelle de Lawton (IADL)",note:"8 instrumental ADLs: telephone/shopping/cooking/housework/laundry/transport/medication/finances"},
{en:"Katz ADL Scale",fr:"échelle de Katz (AVQ)",note:"6 basic ADLs: bathing/dressing/toileting/transferring/continence/feeding"},
// === REHABILITATION ===
{en:"multidisciplinary rehabilitation team",fr:"équipe de rééducation pluridisciplinaire",note:"physiatrist/PT/OT/SLT/psychologist/social worker/nurse/rehabilitation nurse"},
{en:"physiotherapy (PT)",fr:"kinésithérapie / physiothérapie",note:"movement/exercise/electrotherapy/hydrotherapy; strengthening/ROM/balance/gait re-education"},
{en:"occupational therapy (OT)",fr:"ergothérapie",note:"ADL retraining/adaptive equipment/home assessment/return to work/cognitive rehabilitation"},
{en:"speech and language therapy (SLT)",fr:"orthophonie",note:"communication/swallowing; aphasia/dysarthria/dysphonia/dysphagia"},
{en:"aphasia types",fr:"types d'aphasie",note:"Broca (expressive/non-fluent) / Wernicke (receptive/fluent) / Global (severe all modalities) / Anomic (word-finding)"},
{en:"dysarthria",fr:"dysarthrie",note:"motor speech disorder; spastic/flaccid/ataxic/hypokinetic; distinct from aphasia"},
{en:"neuropsychological rehabilitation",fr:"rééducation neuropsychologique",note:"attention/memory/executive function/processing speed; compensatory strategies"},
{en:"vocational rehabilitation",fr:"réadaptation professionnelle / réinsertion au travail",note:"return to work programme; job modification/retraining"},
// === ASSISTIVE TECHNOLOGY ===
{en:"wheelchair (manual/electric)",fr:"fauteuil roulant (manuel / électrique)",note:"manual: self-propelling / carer-pushed; electric: joystick; tilt-in-space for pressure care"},
{en:"standing frame",fr:"verticalisateur / cadre de verticalisation",note:"prevents contractures/osteoporosis; improves circulation; passive standing"},
{en:"hospital/adjustable bed",fr:"lit médicalisé / lit articulé",note:"height-adjustable + backrest/knee breaks; pressure mattress; essential for home care"},
{en:"hoist / patient lift",fr:"lève-personne / lève-malade",note:"mobile hoist/ceiling track/bath hoist; safe patient handling; sling types"},
{en:"grab rails and adaptations",fr:"barres d'appui et adaptations du domicile",note:"bathroom/toilet rails; ramps; stair lift; wet room; home assessment by OT"},
{en:"walking frame / Zimmer frame",fr:"déambulateur / cadre de marche",note:"standard/wheeled/rollator; appropriate for different mobility needs"},
{en:"walking stick / cane",fr:"canne / canne anglaise",note:"single-point / quad / elbow crutch; held opposite to affected limb"},
{en:"orthosis (splint/brace/AFO)",fr:"orthèse (attelle / AFO)",note:"AFO (ankle-foot orthosis) for foot drop; KAFO for knee instability; wrist cock-up for radial nerve palsy"},
{en:"prosthesis (limb)",fr:"prothèse de membre",note:"below-knee (BK) / above-knee (AK) / upper limb; myoelectric/body-powered"},
{en:"AAC (augmentative and alternative communication)",fr:"CAA (communication alternative et augmentée)",note:"low-tech (communication boards) / high-tech (VOCA/eye-gaze device/PECS); SLT assessment"},
{en:"eye-gaze technology",fr:"système de communication par eye-tracking",note:"severe motor disability (ALS/high SCI/LIS); calibration required; speech output"},
{en:"environmental control system",fr:"système de contrôle de l'environnement (SCE)",note:"lights/TV/phone via switch/voice; increases independence for severely disabled"},
{en:"sign language (LSF)",fr:"langue des signes française (LSF)",note:"primary language of Deaf community; distinct from Signed French; interpreter"},
{en:"Braille",fr:"braille",note:"tactile reading/writing; grade 1 uncontracted / grade 2 contracted; refreshable Braille display"},
]},

{id:"geriatrics", label:"Geriatrics", icon:"👴", items:[
// === AGEING & FRAILTY ===
{en:"geriatrics / gerontology",fr:"gériatrie / gérontologie",note:"geriatrics: clinical care; gerontology: science of ageing"},
{en:"physiological ageing",fr:"vieillissement physiologique",note:"reduced organ reserve/GFR/cardiac output/lung compliance/muscle mass/immune function"},
{en:"frailty (Fried phenotype)",fr:"fragilité (phénotype de Fried)",note:"≥3 of 5: weight loss/exhaustion/low grip/low activity/slow walk; pre-frail = 1–2; predicts adverse outcomes"},
{en:"Clinical Frailty Scale (CFS)",fr:"échelle clinique de fragilité (CFS)",note:"1 (very fit) → 9 (terminally ill); score ≥5 = moderately frail; used in triage/intensive care decisions"},
{en:"sarcopenia",fr:"sarcopénie",note:"EWGSOP2: low muscle strength (grip) + low muscle mass/quality; ± low physical performance; falls/fractures/mortality"},
{en:"comprehensive geriatric assessment (CGA)",fr:"évaluation gériatrique globale (EGG)",note:"multidimensional: medical/functional/cognitive/psychological/social/nutritional; guides care plan"},
// === GERIATRIC SYNDROMES ===
{en:"delirium",fr:"delirium / syndrome confusionnel aigu",note:"acute onset + fluctuating consciousness; hyperactive/hypoactive/mixed; precipitants: infection/drugs/pain/constipation/urinary retention"},
{en:"CAM (Confusion Assessment Method)",fr:"CAM (méthode d'évaluation de la confusion)",note:"4 features: acute onset+fluctuation / inattention / disorganised thinking / altered LOC; CAM-ICU version"},
{en:"4AT (rapid delirium assessment)",fr:"4AT",note:"agitation/alertness/abbreviated cognitive test/acute change; ≥4 = probable delirium; 1–3 = possible"},
{en:"falls",fr:"chutes",note:"most common cause of injury death >65y; intrinsic (muscle weakness/balance/vision/medication) + extrinsic (environment) factors"},
{en:"Morse Fall Scale",fr:"échelle de Morse (risque de chute)",note:"6 items: fall history/secondary diagnosis/ambulatory aid/IV/gait/mental status; ≥45 = high risk"},
{en:"Timed Up and Go test (TUG)",fr:"test Timed Up and Go (TUG)",note:">12 sec = fall risk; rise from chair / walk 3m / turn / return / sit"},
{en:"Berg Balance Scale",fr:"échelle de Berg",note:"14 items / 56 points; <45 = fall risk; balance assessment"},
{en:"osteoporosis",fr:"ostéoporose",note:"T-score ≤−2.5 (DXA); fragility fracture risk; bisphosphonates / denosumab / calcium + vit D"},
{en:"FRAX score",fr:"score FRAX",note:"10-year fracture probability; clinical risk factors ± BMD; treatment threshold"},
// === DEMENTIA ===
{en:"dementia (general)",fr:"démence (terme général)",note:"progressive cognitive decline affecting daily function; >55 types; irreversible"},
{en:"Alzheimer's disease",fr:"maladie d'Alzheimer",note:"most common (60–70%); amyloid plaques + neurofibrillary tangles; insidious onset; memory first; AChEI (donepezil)"},
{en:"vascular dementia",fr:"démence vasculaire",note:"2nd most common; stepwise decline; CVD risk factors; stroke history; MRI white matter changes"},
{en:"Lewy body dementia",fr:"démence à corps de Lewy",note:"visual hallucinations + parkinsonism + REM sleep disorder + fluctuating cognition; CI antipsychotics"},
{en:"frontotemporal dementia (FTD)",fr:"démence fronto-temporale (DFT)",note:"behaviour change/language (bvFTD/PPA); onset <65y; tau/TDP-43; no effective therapy"},
{en:"MMSE (Mini-Mental State Examination)",fr:"MMSE",note:"30 points; <24 = cognitive impairment; <10 = severe; ceiling effect in high-education"},
{en:"MoCA (Montreal Cognitive Assessment)",fr:"MoCA",note:"30 points; <26 = MCI; more sensitive than MMSE for MCI; free download"},
{en:"Mini-Cog",fr:"Mini-Cog",note:"3-word recall + clock drawing test; 0–5; <3 = cognitive concern; rapid screen"},
{en:"Clock Drawing Test (CDT)",fr:"test de l'horloge",note:"executive function + visuospatial; simple screening; multiple scoring systems"},
{en:"GDS (Geriatric Depression Scale)",fr:"GDS (échelle de dépression gériatrique)",note:"15 or 30 items; short form: ≥5 = depression; self-rated; excludes somatic items"},
{en:"MCI (mild cognitive impairment)",fr:"trouble cognitif léger (MCI)",note:"cognitive decline beyond normal ageing without functional impairment; amnestic MCI → Alzheimer risk"},
// === POLYPHARMACY ===
{en:"polypharmacy",fr:"polymédication",note:"typically defined as ≥5 regular medications; ≥10 = excessive polypharmacy; increased ADR/fall/interaction risk"},
{en:"Beers Criteria",fr:"liste de Beers (médicaments inappropriés chez le sujet âgé)",note:"American Geriatrics Society; drugs to avoid in >65y: BZDs/anticholinergics/NSAIDs/sedating antihistamines"},
{en:"STOPP/START criteria",fr:"critères STOPP/START",note:"European: STOPP = potentially inappropriate prescriptions; START = potential prescribing omissions"},
{en:"anticholinergic burden",fr:"charge anticholinergique",note:"sum of anticholinergic drug effects; cognitive impairment/constipation/urinary retention/dry mouth/blurred vision"},
{en:"deprescribing",fr:"déprescription",note:"planned reduction/cessation of medications when harm outweighs benefit; patient consent; regular review"},
{en:"Cockcroft-Gault formula",fr:"formule de Cockcroft-Gault",note:"CrCl = [(140−age) × weight × (0.85 if female)] / (72 × SCr); essential for drug dose adjustment in elderly"},
{en:"altered pharmacokinetics in elderly",fr:"pharmacocinétique modifiée chez le sujet âgé",note:"↓GFR (renal elimination) / ↑body fat (volume of distribution of lipophilic drugs) / ↓albumin (protein binding) / ↓hepatic metabolism"},
// === NUTRITION & HYDRATION ===
{en:"malnutrition in elderly",fr:"dénutrition du sujet âgé",note:"HAS criteria: IMC <22 / weight loss ≥5% 1m or ≥10% 6m / albumin <30g/L / MNA-SF ≤11; protein 1.2–1.5g/kg"},
{en:"MNA (Mini Nutritional Assessment)",fr:"MNA (mini évaluation nutritionnelle)",note:"6-item short form (MNA-SF) then full 18-item; ≤11 SF = at risk; ≤17 full = malnourished"},
{en:"dysphagia in elderly",fr:"dysphagie chez le sujet âgé",note:"sarcopenic dysphagia; aspiration pneumonia risk; IDDSI texture/fluid modification; SLT"},
{en:"dehydration",fr:"déshydratation",note:"thirst sensation reduced; urine colour/weight monitoring; ≥1.5L/day aim; signs: confusion/hypotension/concentrated urine"},
// === INCONTINENCE & CONTINENCE ===
{en:"urinary incontinence (UI) in elderly",fr:"incontinence urinaire chez le sujet âgé",note:"DIAPERS mnemonic for transient causes: delirium/infection/atrophic/pharmacological/psychological/excess urine/reduced mobility/stool impaction"},
{en:"bladder retraining",fr:"rééducation vésicale",note:"timed voiding/prompted voiding; first-line for UI; continence nurse-led"},
// === END OF LIFE / ACP ===
{en:"advance care planning (ACP)",fr:"planification anticipée des soins",note:"conversations about values/wishes for future care; before loss of capacity; reduces unwanted interventions"},
{en:"advance directive (directive anticipée)",fr:"directive anticipée",note:"French law Claeys-Leonetti 2016; written instructions for end-of-life; binding on team if incapacity"},
{en:"personne de confiance",fr:"personne de confiance",note:"French: trusted person designated by patient; consulted if patient unable to express wishes; not same as next of kin"},
{en:"DNACPR / DNR order",fr:"ordre de non-réanimation (NTBR / LATA)",note:"do not attempt CPR; medical decision + patient/family discussion; not a withdrawal of other care"},
// === GERIATRIC SETTINGS ===
{en:"EHPAD (établissement d'hébergement pour personnes âgées dépendantes)",fr:"EHPAD",note:"French long-term care facility; AGGIR GIR 1–6 scoring for dependency level"},
{en:"AGGIR scale (GIR 1–6)",fr:"grille AGGIR (GIR 1–6)",note:"French dependency grading; GIR 1–2 = severe/complete dependency → APA (allocation personnalisée d'autonomie); GIR 5–6 = low dependency"},
{en:"SSR (soins de suite et de réadaptation)",fr:"SSR (soins de suite et de réadaptation)",note:"French step-down/rehabilitation unit; post-acute care"},
{en:"SSIAD (service de soins infirmiers à domicile)",fr:"SSIAD",note:"French home nursing care service; IDE visits at home for elderly/disabled"},
]},

{id:"mentalhealth", label:"Mental Health", icon:"🧠", items:[
// === MOOD DISORDERS ===
{en:"major depressive disorder (MDD)",fr:"épisode dépressif caractérisé / trouble dépressif majeur",note:"≥5 symptoms ≥2w: depressed mood/anhedonia/sleep/appetite/concentration/fatigue/guilt/psychomotor/suicidal; PHQ-9 screening"},
{en:"PHQ-9 (Patient Health Questionnaire)",fr:"PHQ-9",note:"9-item depression screen; ≥10 = moderate depression; ≥20 = severe; widely used in primary care"},
{en:"dysthymia / persistent depressive disorder",fr:"dysthymie / trouble dépressif persistant",note:"chronic low mood ≥2 years; less severe than MDD; often superimposed (double depression)"},
{en:"bipolar disorder type I",fr:"trouble bipolaire de type I",note:"manic episodes (≥7d or hospitalised) + depressive episodes; mood stabilisers (lithium/valproate)"},
{en:"bipolar disorder type II",fr:"trouble bipolaire de type II",note:"hypomania (≥4d without hospitalisation) + major depression; lithium preferred"},
{en:"manic episode",fr:"épisode manique",note:"elevated/irritable mood + increased energy + decreased sleep + grandiosity + racing thoughts + impulsivity ≥1w"},
{en:"hypomania",fr:"hypomanie",note:"mild mania without impairment or psychosis; ≥4 days"},
{en:"cyclothymia",fr:"cyclothymie",note:"≥2y subsyndromal mood swings; bipolar spectrum"},
// === ANXIETY DISORDERS ===
{en:"generalised anxiety disorder (GAD)",fr:"trouble anxieux généralisé (TAG)",note:"excessive worry ≥6m on multiple topics + muscle tension/fatigue/concentration/irritability/sleep; GAD-7 ≥10"},
{en:"panic disorder",fr:"trouble panique",note:"recurrent unexpected panic attacks + anticipatory anxiety ≥1m; SSRI + CBT first-line"},
{en:"panic attack",fr:"attaque de panique",note:"intense fear peak <10min: palpitations/sweating/trembling/dyspnoea/chest pain/derealization/fear of dying"},
{en:"social anxiety disorder",fr:"trouble anxieux social / phobie sociale",note:"fear of social situations; avoidance; CBT/SSRI"},
{en:"specific phobia",fr:"phobie spécifique",note:"animal/situational/blood-injection-injury (BII)/natural environment; CBT/exposure"},
{en:"agoraphobia",fr:"agoraphobie",note:"fear of open/crowded/unavoidable situations; often with panic disorder"},
{en:"OCD (obsessive-compulsive disorder)",fr:"trouble obsessionnel compulsif (TOC)",note:"obsessions (intrusive thoughts) + compulsions (repetitive behaviours); Y-BOCS scale; SSRI high dose + ERP"},
{en:"PTSD (post-traumatic stress disorder)",fr:"état de stress post-traumatique (ESPT / PTSD)",note:"trauma exposure + re-experiencing/avoidance/negative cognitions/hyperarousal ≥1m; trauma-focused CBT/EMDR/sertraline"},
{en:"acute stress disorder",fr:"trouble aigu du stress",note:"<1m after trauma; re-experiencing + avoidance + hyperarousal; trauma-focused CBT"},
// === PSYCHOTIC DISORDERS ===
{en:"schizophrenia",fr:"schizophrénie",note:"positive (hallucinations/delusions/disorganisation) + negative (alogia/anhedonia/flat affect/avolition) symptoms ≥6m; antipsychotics"},
{en:"schizophreniform disorder",fr:"trouble schizophréniforme",note:"schizophrenia symptoms 1–6m"},
{en:"schizoaffective disorder",fr:"trouble schizoaffectif",note:"psychosis + major mood episode simultaneously; antipsychotic ± mood stabiliser"},
{en:"brief psychotic disorder",fr:"trouble psychotique bref",note:"psychosis <1m; often reactive to stress"},
{en:"delusional disorder",fr:"trouble délirant persistant",note:"non-bizarre delusions ≥1m; no prominent hallucinations; functioning relatively preserved"},
{en:"hallucinations",fr:"hallucinations",note:"auditory (most common in schizophrenia) / visual (delirium/LBD) / tactile / olfactory / gustatory"},
{en:"delusions",fr:"idées délirantes",note:"fixed false beliefs; persecutory (most common) / grandiose / referential / somatic / erotomanic"},
{en:"thought disorder",fr:"trouble de la pensée / désorganisation formelle",note:"loose associations/tangentiality/circumstantiality/flight of ideas/thought blocking/neologisms"},
{en:"first-episode psychosis (FEP)",fr:"premier épisode psychotique (PEP)",note:"early intervention; DUP (duration of untreated psychosis); ARMS (at-risk mental state) services"},
// === PERSONALITY DISORDERS ===
{en:"personality disorder",fr:"trouble de la personnalité",note:"enduring maladaptive patterns across domains; clusters A (odd)/B (dramatic)/C (anxious); stable over time"},
{en:"borderline personality disorder (BPD / EUPD)",fr:"trouble de la personnalité borderline (TPB)",note:"emotional dysregulation/identity disturbance/impulsivity/unstable relationships/SI; DBT first-line"},
{en:"antisocial personality disorder (ASPD)",fr:"trouble de la personnalité antisociale",note:"disregard for others' rights; deceitfulness/impulsivity/aggression; history of conduct disorder before 15"},
// === EATING DISORDERS ===
{en:"anorexia nervosa (AN)",fr:"anorexie mentale",note:"restriction + fear of weight gain + disturbed body image; BMI <17.5; medical complications (bradycardia/electrolytes); highest mortality of all psychiatric disorders"},
{en:"bulimia nervosa (BN)",fr:"boulimie nervosa",note:"binge-purge cycles; normal BMI; dental erosion/parotid swelling/Russel's sign; CBT-ED + SSRI (fluoxetine high dose)"},
{en:"binge eating disorder (BED)",fr:"hyperphagie boulimique",note:"recurrent binges without purging; distress + no compensatory behaviours; obesity association"},
{en:"ARFID (avoidant restrictive food intake disorder)",fr:"ARFID (trouble de l'évitement/restriction de l'ingestion d'aliments)",note:"picky eating without body image disturbance; sensory sensitivity/fear of choking/lack of interest"},
// === NEURODEVELOPMENTAL ===
{en:"ADHD (in adults)",fr:"TDA/H (adulte)",note:"inattentive/hyperactive/combined subtypes; methylphenidate/atomoxetine; CBT adjunct; DSM-5 onset <12y"},
{en:"autism spectrum disorder (ASD)",fr:"trouble du spectre de l'autisme (TSA)",note:"social communication deficit + restricted/repetitive behaviours; level 1–3 severity; no single pharmacotherapy"},
// === SUBSTANCE USE ===
{en:"alcohol use disorder (AUD)",fr:"trouble de l'usage de l'alcool (TUA)",note:"AUDIT-C screening (≥3F/≥4M = positive); ICD-11 mild/moderate/severe; acamprosate/naltrexone for relapse prevention"},
{en:"alcohol withdrawal syndrome",fr:"syndrome de sevrage alcoolique",note:"6–24h after last drink; tremor/sweating/tachycardia/anxiety/seizures/delirium tremens; CIWA-Ar scale; diazepam protocol"},
{en:"Wernicke-Korsakoff syndrome",fr:"syndrome de Wernicke-Korsakoff",note:"thiamine deficiency; Wernicke: confusion+ophthalmoplegia+ataxia (treat IV thiamine 500mg TID before glucose); Korsakoff: amnestic"},
{en:"opioid use disorder (OUD)",fr:"trouble de l'usage d'opioïdes",note:"dependence + tolerance + withdrawal; OST: methadone (daily supervised) or buprenorphine/naloxone (Suboxone)"},
{en:"opioid withdrawal",fr:"sevrage aux opioïdes",note:"onset 8–24h (short-acting) / 36–48h (methadone); COWS scale; clonidine/loperamide symptomatic; lofexidine"},
{en:"benzodiazepine dependence",fr:"dépendance aux benzodiazépines",note:"gradual taper over weeks-months; diazepam equivalents; withdrawal seizure risk"},
{en:"cannabis use disorder",fr:"trouble de l'usage du cannabis",note:"chronic use → motivation/memory/psychosis risk in susceptible; CBD non-psychoactive; CBT for cessation"},
// === ASSESSMENT TOOLS ===
{en:"mental state examination (MSE)",fr:"examen du status mental",note:"appearance/behaviour/speech/mood+affect/thought form+content/perception/cognition/insight/judgement"},
{en:"Columbia Suicide Severity Rating Scale (C-SSRS)",fr:"C-SSRS (échelle de Columbia)",note:"suicidal ideation + behaviour; active/passive ideation; intensity; behaviour history; safety planning"},
{en:"risk assessment (suicide/violence)",fr:"évaluation du risque suicidaire / de violence",note:"static (history/demographic) + dynamic (current mental state/stressors/substances/insight/protective factors) risk"},
// === PSYCHOTHERAPY ===
{en:"cognitive behavioural therapy (CBT)",fr:"thérapie cognitive et comportementale (TCC)",note:"structured; thought records/behavioural experiments/exposure; depression/anxiety/PTSD/OCD/eating disorders"},
{en:"dialectical behaviour therapy (DBT)",fr:"thérapie comportementale dialectique (TCD)",note:"BPD; mindfulness/distress tolerance/emotional regulation/interpersonal effectiveness"},
{en:"EMDR (eye movement desensitisation and reprocessing)",fr:"EMDR",note:"PTSD first-line; bilateral stimulation while recalling trauma; NICE recommended"},
{en:"psychodynamic psychotherapy",fr:"psychothérapie psychodynamique",note:"unconscious processes/early attachments/transference-countertransference; long-term"},
{en:"motivational interviewing (MI)",fr:"entretien motivationnel (EM)",note:"ambivalence; OARS: open questions/affirmation/reflection/summary; change talk; substance use/behaviour change"},
// === PSYCHOPHARMACOLOGY ===
{en:"SSRIs (selective serotonin reuptake inhibitors)",fr:"ISRS (inhibiteurs sélectifs de la recapture de la sérotonine)",note:"first-line depression/anxiety/OCD; fluoxetine/sertraline/citalopram/escitalopram/paroxetine; 2–4w onset; serotonin syndrome risk"},
{en:"SNRIs (serotonin-norepinephrine reuptake inhibitors)",fr:"IRSNa",note:"venlafaxine/duloxetine; depression + pain (duloxetine); discontinuation syndrome"},
{en:"TCAs (tricyclic antidepressants)",fr:"antidépresseurs tricycliques (ATC)",note:"amitriptyline/clomipramine; toxic overdose; anticholinergic SEs; neuropathic pain adjunct"},
{en:"MAOIs (monoamine oxidase inhibitors)",fr:"IMAO",note:"phenelzine/tranylcypromine; tyramine dietary restriction (cheese effect); drug interactions; rarely used"},
{en:"lithium",fr:"lithium",note:"mood stabiliser; bipolar prophylaxis; narrow TI (0.6–0.8 mmol/L therapeutic; >1.5 = toxic: tremor/ataxia/polyuria/renal); monitor TDM+U&E+TFTs"},
{en:"valproate (valproic acid)",fr:"valproate de sodium / acide valproïque",note:"bipolar mania; CI in women of childbearing potential (PREVENT programme); teratogenic; hepatotoxic"},
{en:"typical antipsychotics (FGAs)",fr:"antipsychotiques typiques (AP1G)",note:"haloperidol/chlorpromazine; D2 blockade; EPS (dystonia/parkinsonism/akathisia/TD); NMS risk"},
{en:"atypical antipsychotics (SGAs)",fr:"antipsychotiques atypiques (AP2G)",note:"olanzapine/risperidone/quetiapine/aripiprazole; lower EPS; metabolic syndrome/weight gain; clozapine for TRS"},
{en:"clozapine",fr:"clozapine",note:"treatment-resistant schizophrenia; agranulocytosis 1% (mandatory WBC monitoring); most effective antipsychotic; myocarditis/seizure/hypersalivation"},
{en:"neuroleptic malignant syndrome (NMS)",fr:"syndrome malin des neuroleptiques (SMN)",note:"antipsychotic-induced; fever + rigidity + altered LOC + autonomic instability + raised CK; stop drug; dantrolene/bromocriptine; ICU"},
{en:"tardive dyskinesia (TD)",fr:"dyskinésie tardive (DT)",note:"repetitive involuntary movements (oro-facial/limbs) after prolonged antipsychotics; AIMS scale; valbenazine/tetrabenazine"},
// === LEGAL / PSYCHIATRIC ADMISSION ===
{en:"voluntary admission",fr:"hospitalisation libre (HL)",note:"patient consents; can leave; most common"},
{en:"involuntary admission (SDRE / SDT)",fr:"hospitalisation sans consentement (SDRE / SDT)",note:"SDRE: at request of third party (tiers); SDT: at request of state representative (préfet); dangerousness criterion; France: Loi 2011"},
{en:"mental health tribunal",fr:"juge des libertés et de la détention (JLD)",note:"French court review of compulsory hospitalisation; must review within 12 days; patient rights"},
{en:"crisis intervention",fr:"intervention de crise / gestion de crise",note:"de-escalation/safe environment/PRN medication; risk assessment; liaison psychiatry"},
]},

{id:"communication", label:"Communication", icon:"💬", items:[
// === NURSING PROCESS ===
{en:"nursing process (ADPIE)",fr:"démarche de soins infirmiers",note:"Assessment / Diagnosis / Planning / Implementation / Evaluation; cyclic; evidence-based nursing practice"},
{en:"nursing assessment",fr:"recueil de données / évaluation infirmière",note:"subjective (patient report) + objective (observation/measurement); head-to-toe or systems approach"},
{en:"nursing diagnosis (NANDA-I)",fr:"diagnostic infirmier (NANDA)",note:"clinical judgement about response to health problem; 3-part: problem + aetiology + signs/symptoms (PES)"},
{en:"SMART goals (nursing care plan)",fr:"objectifs SMART (plan de soins)",note:"Specific / Measurable / Achievable / Realistic / Time-bound; patient-centred outcomes"},
{en:"nursing care plan",fr:"plan de soins infirmiers (PSI)",note:"problem list / goals / nursing interventions / evaluation; individualised; updated each shift"},
{en:"NIC/NOC (nursing interventions/outcomes classification)",fr:"NIC / NOC (classification des interventions et des résultats infirmiers)",note:"standardised nursing language; NIC = interventions; NOC = patient outcomes"},
{en:"SOAP note",fr:"note SOAP",note:"Subjective / Objective / Assessment / Plan; documentation format; clear clinical reasoning"},
{en:"SOAIPE note",fr:"note SOAIPE",note:"Subjective / Objective / Analysis / Intervention / Plan / Evaluation; common in French nursing"},
{en:"DAR (data-action-response) note",fr:"note DAR (Donnée-Action-Résultat)",note:"French nursing documentation format; D=observation/data / A=nursing action / R=patient response"},
{en:"focus charting",fr:"transmissions ciblées",note:"French nursing: cible (problem focus) + données + actions + résultats; flowsheet + narrative"},
// === CLINICAL HANDOVER ===
{en:"SBAR (Situation-Background-Assessment-Recommendation)",fr:"SBAR (Situation-Contexte-Évaluation-Recommandation)",note:"WHO safety standard; structured handover for urgent/deteriorating patient communication"},
{en:"ISBAR (Identity-SBAR)",fr:"ISBAR",note:"I: identify yourself and patient; + SBAR; reduces communication errors"},
{en:"PACE (Patient-Assessment-Change-Evaluation)",fr:"PACE",note:"alternative handover tool; handover to medical staff"},
{en:"bedside handover",fr:"relève au chevet du patient",note:"patient involvement; visual check; reduces omission errors; preferred in ward settings"},
{en:"SAED (Situation-Antécédents-Évaluation-Demande)",fr:"SAED",note:"French equivalent of SBAR; used in French hospital handover communication"},
{en:"MET call / rapid response",fr:"appel de l'équipe mobile de réanimation / réponse rapide",note:"clinical deterioration triggers: RR >25 / SpO2 <90 / HR <40 or >130 / SBP <90 / LOC change"},
{en:"MEWS/NEWS2",fr:"score MEWS / NEWS2",note:"National Early Warning Score 2 (UK): RR/SpO2/supplemental O2/temp/SBP/HR/AVPU; ≥5 urgent review; ≥7 emergency"},
// === DOCUMENTATION ===
{en:"electronic health record (EHR / DPI)",fr:"dossier patient informatisé (DPI) / dossier médical partagé (DMP)",note:"France: DMP (shared medical record accessible by patient and all carers); EHR per institution"},
{en:"medication administration record (MAR)",fr:"fiche de prescription et administration médicamenteuse (FPAM)",note:"prescriber orders + nurse administration record; double signature for high-risk drugs"},
{en:"incident report (fiche d'événement indésirable)",fr:"fiche de déclaration d'événement indésirable (FSEI / IRAS)",note:"near miss + adverse event reporting; IRAS (France); non-punitive; safety learning"},
{en:"CREX (comité de retour d'expérience)",fr:"CREX",note:"French structured multidisciplinary root cause analysis meeting after adverse event"},
{en:"legal principles of documentation",fr:"principes juridiques de la documentation",note:"contemporaneous / accurate / factual / objective / legible / signed / dated / no unauthorised alteration"},
{en:"duty of candour",fr:"devoir de transparence / obligation de révélation",note:"legal duty to be open with patients when something goes wrong; France: loi KOUCHNER 2002"},
// === PATIENT COMMUNICATION ===
{en:"verbal communication",fr:"communication verbale",note:"words/language/tone/pitch/speed/volume; affected by pain/anxiety/cultural factors"},
{en:"non-verbal communication",fr:"communication non verbale",note:"body language/facial expression/gestures/eye contact/proxemics/touch; 55% of meaning (Mehrabian)"},
{en:"active listening",fr:"écoute active",note:"attending/reflecting/empathy/clarification/summarising; avoid interrupting; SOLER body language"},
{en:"empathy",fr:"empathie",note:"understanding another's emotional experience; affective empathy (feeling) + cognitive empathy (understanding); vs sympathy"},
{en:"therapeutic communication",fr:"communication thérapeutique",note:"purposeful; builds trust; facilitates disclosure; nurse-patient relationship"},
{en:"open question",fr:"question ouverte",note:"encourages elaboration; 'how are you feeling today?'; more information gathered"},
{en:"closed question",fr:"question fermée",note:"yes/no answer; useful for specific information; 'do you have chest pain?'"},
{en:"reflective question",fr:"question-reflet / question réflexive",note:"'so you're worried about…?'; validates feeling; encourages elaboration"},
{en:"motivational interviewing (MI) principles",fr:"entretien motivationnel — principes",note:"OARS: Open questions / Affirmations / Reflections / Summary; roll with resistance; develop discrepancy"},
{en:"teach-back method",fr:"méthode teach-back / retour d'information",note:"patient explains back in their own words; confirms understanding; reduces readmission"},
{en:"health literacy",fr:"littératie en santé",note:"ability to obtain/process/understand health information; ⅓ of adults have low HL; plain language; visual aids"},
{en:"plain language / EasyRead",fr:"langage clair / FALC (facile à lire et à comprendre)",note:"short sentences/active voice/no jargon; FALC standard (France) for intellectual disability/low literacy"},
{en:"interpreter / language services",fr:"interprète / service de traduction médicale",note:"professional medical interpreter preferred; avoid using family; LINC assessment for French nursing"},
{en:"breaking bad news (SPIKES)",fr:"annonce d'une mauvaise nouvelle (protocole SPIKES)",note:"S: Setting / P: Perception / I: Invitation / K: Knowledge / E: Emotions+Empathy / S: Summary+Strategy; France: Loi Kouchner 2002 duty to inform"},
{en:"patient education / therapeutic education (ETP)",fr:"éducation thérapeutique du patient (ETP)",note:"WHO/HAS: structured programme; chronic disease self-management; competency assessment; multidisciplinary"},
// === ETHICS & LAW ===
{en:"bioethical principles (Beauchamp & Childress)",fr:"principes éthiques biomédicaux",note:"Autonomy / Beneficence / Non-maleficence / Justice; 'principlism'; applied to all clinical decisions"},
{en:"autonomy",fr:"autonomie",note:"right to make one's own decisions; requires capacity + information + voluntariness; informed consent"},
{en:"beneficence",fr:"bienfaisance",note:"act in the patient's best interest; positive duty to help"},
{en:"non-maleficence",fr:"non-malfaisance",note:"first, do no harm; primum non nocere; risk-benefit analysis"},
{en:"justice",fr:"justice",note:"fair distribution of resources/treatment; equitable care; non-discrimination"},
{en:"capacity (mental capacity)",fr:"capacité de discernement / consentement éclairé",note:"France: capacité juridique; 4 criteria: understand/retain/weigh up/communicate; fluctuating; decision-specific"},
{en:"informed consent",fr:"consentement libre et éclairé",note:"voluntary / informed / capacity; written for surgical/invasive; implied for routine care; withdrawal at any time; France Loi Kouchner 2002"},
{en:"best interests decision",fr:"décision dans l'intérêt du patient (personne de confiance / tuteur)",note:"for patient lacking capacity; involve personne de confiance/family; values/prior wishes considered"},
{en:"confidentiality / professional secrecy",fr:"confidentialité / secret professionnel",note:"France: obligation légale (Code pénal Art.226-13); exceptions: safeguarding/public health/court order"},
{en:"patient charter / Charte du patient hospitalisé",fr:"Charte du patient hospitalisé",note:"France: Loi 2002-303 (droits des malades); right to information/consent/privacy/pain management/dignity"},
{en:"Loi Claeys-Leonetti 2016",fr:"loi Claeys-Leonetti 2016",note:"France: advance directives now binding; right to deep sedation until death (sédation profonde et continue) for terminal patients; no euthanasia/PAS"},
{en:"mandatory reporting (signalement)",fr:"signalement obligatoire",note:"France: child/elder/domestic violence abuse; STI notification; notifiable infectious diseases (MDO); no professional secrecy bar"},
{en:"Ordre National des Infirmiers (ONI)",fr:"Ordre National des Infirmiers (ONI)",note:"French nursing regulatory body; registration/professional code of conduct/disciplinary proceedings"},
{en:"scope of practice (IDE)",fr:"champ de compétences de l'IDE",note:"France: Décret de compétences 2004; IDE prescribes/administers/evaluates under medical supervision; autonomous acts listed"},
{en:"negligence / faute professionnelle",fr:"faute professionnelle / négligence",note:"breach of duty of care causing foreseeable harm; civil/criminal/disciplinary; Bolam test (UK)"},
// === DISCHARGE & CONTINUITY ===
{en:"discharge planning",fr:"planification de la sortie / préparation du retour à domicile",note:"begins on admission; social work/OT/pharmacy/community nursing involved; discharge summary"},
{en:"discharge summary / compte rendu d'hospitalisation",fr:"compte rendu d'hospitalisation (CRH)",note:"diagnosis/treatment/medications/follow-up; sent to GP within 24h of discharge; France: DMP"},
{en:"referral",fr:"orientation / demande de consultation",note:"to specialist/community services/APA; standardised form; urgency graded"},
{en:"MDT (multidisciplinary team)",fr:"équipe pluridisciplinaire / pluriprofessionnelle",note:"physicians/nurses/AHPs/pharmacist/social worker; weekly meetings; patient-centred decision-making"},
]},

{id:"palliative", label:"Palliative Care", icon:"🕊️", items:[
// === DEFINITION & FRAMEWORK ===
{en:"palliative care (WHO definition)",fr:"soins palliatifs (définition OMS)",note:"active total care improving QoL of patient + family facing life-threatening illness; neither hastens nor postpones death"},
{en:"palliative medicine",fr:"médecine palliative",note:"medical specialty; symptoms/communication/ethics/family support; Société Française d'Accompagnement et de Soins Palliatifs (SFAP)"},
{en:"supportive care",fr:"soins de support",note:"broader concept; during active treatment; fatigue/nutrition/psychosocial; not synonymous with palliative"},
{en:"hospice (maison de soins palliatifs)",fr:"maison de soins palliatifs (MSP)",note:"France: residential facility for those unable to die at home; 24h care; not hospital"},
{en:"EMSP (équipe mobile de soins palliatifs)",fr:"EMSP",note:"French mobile palliative care team; consults within hospital; doesn't take over care"},
{en:"LISP (lits identifiés soins palliatifs)",fr:"LISP",note:"French: identified palliative care beds within non-palliative units"},
{en:"USP (unité de soins palliatifs)",fr:"USP",note:"dedicated palliative care unit; specialist team; complex symptom management + end-of-life"},
{en:"HAD (hospitalisation à domicile)",fr:"HAD",note:"French home hospitalisation; allows complex palliative care at home including SC infusions"},
// === SYMPTOM MANAGEMENT — PAIN ===
{en:"DOLOPLUS-2",fr:"DOLOPLUS-2",note:"behavioural pain scale for cognitively impaired elderly; 10 items; ≥5 = pain present"},
{en:"ALGOPLUS",fr:"ALGOPLUS",note:"acute pain in elderly with communication disorder; 5 items (face/look/complaint/body/behaviour); ≥2 = pain"},
{en:"ABBEY pain scale",fr:"échelle ABBEY",note:"dementia/non-verbal patients; 6 items; total 0–18: minimal/mild/moderate/severe"},
{en:"opioid titration (strong opioids)",fr:"titration des opioïdes forts",note:"start morphine PO 5–10mg/4h (2.5–5mg elderly) + same dose PRN; review 24h; titrate until controlled; convert to modified release"},
{en:"opioid conversion / equianalgesic dosing",fr:"rotation et conversion des opioïdes",note:"oral morphine:SC morphine = 2:1; oral morphine:transdermal fentanyl 25μg/h ≈ 60mg/24h oral morphine; conversion calculators"},
{en:"opioid rotation",fr:"rotation d'opioïdes",note:"switch to different opioid for poor pain control or intolerable SEs; incomplete cross-tolerance → reduce dose 25–30%"},
{en:"adjuvant analgesics",fr:"analgésiques adjuvants / co-analgésiques",note:"neuropathic pain: amitriptyline/gabapentinoids; bone pain: NSAIDs/bisphosphonates/dexamethasone; visceral: antispasmodics"},
{en:"subcutaneous infusion (CSCI / syringe driver)",fr:"perfusion sous-cutanée (pousse-seringue / diffuseur)",note:"when oral route unavailable; 24h; compatible drugs in single syringe; regular nursing checks"},
{en:"anticipatory medications (\"just in case\" box)",fr:"médicaments anticipés / prescription anticipée",note:"PRN prescriptions ready at home: morphine/midazolam/glycopyrronium/haloperidol; nurse can give without delay"},
// === SYMPTOM MANAGEMENT — OTHER SYMPTOMS ===
{en:"dyspnoea in palliative care",fr:"dyspnée en soins palliatifs",note:"low-dose oral/SC morphine (2–5mg PRN) reduces dyspnoea even without hypoxaemia; O2 for confirmed hypoxia only; anxiolytics"},
{en:"nausea and vomiting — palliative",fr:"nausées et vomissements en soins palliatifs",note:"identify cause: opioid-induced (haloperidol 1.5mg nocte) / bowel obstruction (hyoscine+dexamethasone) / raised ICP (dexamethasone) / metabolic"},
{en:"constipation — palliative",fr:"constipation en soins palliatifs",note:"universal with opioids; prevent with stimulant laxative (senna) + softener (macrogol); methylnaltrexone SC for opioid-induced RC"},
{en:"malignant bowel obstruction",fr:"occlusion intestinale maligne",note:"NG tube / SC hyoscine + dexamethasone + diamorphine syringe driver; octreotide reduces secretions; surgery rarely appropriate"},
{en:"excessive secretions / death rattle",fr:"râles agoniques / hypersécrétion bronchique terminale",note:"SC glycopyrronium (0.2mg) or hyoscine (0.4mg); reposition; explain to family; not distressing to patient"},
{en:"anxiety in palliative care",fr:"anxiété en soins palliatifs",note:"midazolam 2.5–5mg SC PRN; lorazepam SL; counselling; meaning-centred therapy; chaplaincy"},
{en:"delirium in palliative care",fr:"delirium en soins palliatifs",note:"identify reversible causes first; haloperidol 0.5–1mg SC for agitation; terminal agitation → midazolam/levomepromazine CSCI"},
{en:"anorexia-cachexia syndrome",fr:"syndrome anorexie-cachexie",note:"cytokine-driven; dexamethasone/megestrol short-term appetite; artificial nutrition rarely appropriate in dying"},
{en:"fatigue (cancer-related)",fr:"fatigue liée au cancer / asthénie",note:"most common palliative symptom; energy conservation/exercise if able; treat reversible causes (anaemia/hypothyroid/depression)"},
{en:"pruritus — palliative",fr:"prurit en soins palliatifs",note:"cholestatic: cholestyramine/rifampicin; opioid-induced: ondansetron/naltrexone; uraemic: UVB/gabapentin"},
{en:"hiccups",fr:"hoquet persistant",note:"chlorpromazine (most evidence)/haloperidol/baclofen/metoclopramide; identify cause (gastric distension/diaphragm irritation)"},
// === END OF LIFE CARE ===
{en:"recognition of dying",fr:"reconnaissance de l'agonie / phase terminale",note:"signs: bed-bound + semi-comatose + minimal intake + unable to swallow + mottling/peripherally cold + Cheyne-Stokes breathing"},
{en:"Liverpool Care Pathway (LCP) / individualised care plan",fr:"chemin clinique de fin de vie / plan de soins individualisé",note:"LCP withdrawn UK 2013; replaced by individualised plans; French: recommandations de bonnes pratiques SFAP/HAS"},
{en:"comfort care bundle (last days)",fr:"soins de confort en phase terminale",note:"mouth care/pressure care/symptom control review/family communication/spiritual care/anticipatory medications prescribed"},
{en:"oral care in dying patient",fr:"soins de bouche chez le patient mourant",note:"frequency ≥2h; small moistened swabs; petroleum jelly for lips; even when nil by mouth"},
{en:"mottling (livedo reticularis)",fr:"marbrures / livedo",note:"peripheral circulatory shutdown; lace-like blue-purple skin pattern; hands/feet/knees; sign of imminent death"},
{en:"Cheyne-Stokes breathing",fr:"respiration de Cheyne-Stokes",note:"crescendo-decrescendo respiratory pattern with apnoeic periods; imminent death or severe brain injury"},
{en:"last offices / post-mortem care",fr:"soins mortuaires / toilette mortuaire",note:"respectful care of body after death; cultural/religious considerations; family may be present; legal requirements (certificate)"},
{en:"death certificate",fr:"certificat de décès",note:"medical certifier; cause of death / underlying cause; reportable deaths to coroner/procureur"},
// === PALLIATIVE SEDATION & ETHICS ===
{en:"palliative sedation",fr:"sédation à visée palliative",note:"proportionate sedation for refractory symptoms; distinguishable from euthanasia (symptom relief, not death as goal); SFAP guidelines"},
{en:"deep continuous sedation until death (DCSD)",fr:"sédation profonde et continue jusqu'au décès (SPCD)",note:"France Loi Claeys-Leonetti 2016; terminal suffering refractory to all other treatment; midazolam CSCI; patient must request if capacitous"},
{en:"euthanasia vs assisted dying",fr:"euthanasie vs aide médicale à mourir",note:"euthanasia: physician administers lethal drug; PAS: patient self-administers; both illegal in France (2024 debate ongoing)"},
{en:"withdrawal of life-sustaining treatment (WLST)",fr:"limitation et arrêt des thérapeutiques actives (LATA)",note:"France Loi Leonetti 2005 + Claeys-Leonetti 2016; collegial decision; not euthanasia; patient/family/advance directive consulted"},
{en:"futility",fr:"obstination déraisonnable / acharnement thérapeutique",note:"disproportionate treatment with no expected benefit; prohibited by French law Claeys-Leonetti 2016"},
// === ACP & LEGAL ===
{en:"advance care planning (ACP)",fr:"planification anticipée des soins (PAS)",note:"ongoing conversations about values/preferences/goals; preferred place of care/death; before loss of capacity"},
{en:"advance directive (directive anticipée)",fr:"directive anticipée",note:"France: binding since Loi 2016; patient states wishes for end-of-life; maintained in DMP; physician must follow unless emergency"},
{en:"personne de confiance",fr:"personne de confiance",note:"trusted person nominated in writing; consulted first if patient lacks capacity; overrides family; distinct from next of kin"},
{en:"DNACPR / LAT order",fr:"NTBR / LATA (limitation des actes thérapeutiques)",note:"Do Not Attempt CPR / limitation of active treatment; medical decision + discussion; reviewed regularly"},
{en:"goals of care conversation",fr:"entretien sur les objectifs de soins",note:"curative → disease-modifying → comfort goals; resetting expectations; skills training for nurses"},
// === BEREAVEMENT ===
{en:"Kübler-Ross 5 stages of grief",fr:"5 stades du deuil de Kübler-Ross",note:"denial / anger / bargaining / depression / acceptance; not linear; for patient AND bereaved; model has limitations"},
{en:"Worden's 4 tasks of mourning",fr:"4 tâches du deuil de Worden",note:"accept reality / process grief and pain / adjust to changed world / find way to remember while embarking on new life"},
{en:"complicated grief / prolonged grief disorder",fr:"deuil compliqué / trouble prolongé du deuil",note:"DSM-5-TR: intense grief >12m (6m in children) with functional impairment; grief-focused CBT; bereavement counselling"},
{en:"bereavement support",fr:"soutien au deuil / accompagnement des proches",note:"bereavement coordinator/counsellor; support groups; chaplaincy; refer to EMSP or association if complicated grief"},
{en:"staff debriefing / Schwartz rounds",fr:"débriefing d'équipe / Schwartz rounds",note:"after difficult deaths/traumatic events; peer support; prevent compassion fatigue/burnout; Schwartz rounds (MDT narrative)"},
]},
];

let currentSection = "anatomy";
let searchQuery = "";

function buildSidebar() {
  const nav = document.getElementById("nav");
  nav.innerHTML = THEMES.map(t =>
    `<button class="nav-btn${t.id===currentSection?' active':''}" onclick="showSection('${t.id}')">
      <span>${t.icon}</span><span>${t.label}</span>
      <span class="count">${t.items.length}</span>
    </button>`
  ).join("");
}

function showSection(id) {
  currentSection = id;
  searchQuery = "";
  document.getElementById("searchInput").value = "";
  buildSidebar();
  renderMain();
}

function filterCards() {
  searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
  renderMain();
}

function renderMain() {
  const grid = document.getElementById("grid");
  const noResults = document.getElementById("no-results");
  const titleEl = document.getElementById("section-title");
  const subEl = document.getElementById("section-sub");

  if (searchQuery.length > 1) {
    titleEl.textContent = `Search: "${document.getElementById("searchInput").value}"`;
    subEl.textContent = "Searching all themes…";
    let cards = [];
    THEMES.forEach(t => {
      t.items.forEach(item => {
        if (item.en.toLowerCase().includes(searchQuery) || item.fr.toLowerCase().includes(searchQuery) || (item.note||"").toLowerCase().includes(searchQuery)) {
          cards.push(cardHTML(item, `<span class="theme-tag">${t.icon} ${t.label}</span>`));
        }
      });
    });
    grid.innerHTML = cards.join("");
    noResults.style.display = cards.length ? "none" : "block";
  } else {
    const theme = THEMES.find(t => t.id === currentSection);
    titleEl.textContent = `${theme.icon} ${theme.label}`;
    subEl.textContent = `${theme.items.length} terms`;
    grid.innerHTML = theme.items.map(i => cardHTML(i, "")).join("");
    noResults.style.display = "none";
  }
}

function cardHTML(item, extra) {
  const safeEn = item.en.replace(/"/g, '&quot;');
  return `<div class="card">
    <div class="card-top">
      <div class="en">${item.en}</div>
      <button class="speak-btn" onclick="speakWord('${safeEn}')" title="Listen to pronunciation" aria-label="Listen">🔊</button>
    </div>
    <div class="fr">${item.fr}</div>
    ${item.note ? `<div class="note">${item.note}</div>` : ""}
    ${extra}
  </div>`;
}

function speakWord(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-GB";
  utter.rate = 0.9;
  // prefer a British or US English voice if available
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.lang === "en-GB") || voices.find(v => v.lang.startsWith("en-US")) || voices.find(v => v.lang.startsWith("en"));
  if (preferred) utter.voice = preferred;
  window.speechSynthesis.speak(utter);
}

function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.getAttribute("data-theme") === "dark";
  root.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("themeBtn").textContent = isDark ? "🌙" : "☀️";
}

buildSidebar();
renderMain();
</script>
</body>
</html>
