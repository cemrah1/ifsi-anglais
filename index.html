<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --primary: #2563eb;
  --primary-light: #dbeafe;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --nav-bg: #1e293b;
  --nav-text: #cbd5e1;
  --nav-active: #2563eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --primary: #3b82f6;
  --primary-light: #1e3a5f;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: #334155;
  --nav-bg: #0a111e;
  --nav-text: #94a3b8;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a; --surface: #1e293b; --primary: #3b82f6;
    --primary-light: #1e3a5f; --text: #f1f5f9; --text-muted: #94a3b8;
    --border: #334155; --nav-bg: #0a111e; --nav-text: #94a3b8;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
#header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 12px; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
#header h1 { font-size: 1.1rem; font-weight: 700; color: var(--primary); white-space: nowrap; }
#searchInput { flex: 1; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.95rem; outline: none; }
#searchInput:focus { border-color: var(--primary); }
#themeBtn { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 1rem; }
#layout { display: flex; height: calc(100vh - 57px); }
#nav { width: 220px; min-width: 180px; background: var(--nav-bg); overflow-y: auto; padding: 12px 0; }
.nav-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 16px; background: none; border: none; color: var(--nav-text); cursor: pointer; font-size: 0.88rem; text-align: left; transition: background .15s; }
.nav-btn:hover { background: rgba(255,255,255,.06); }
.nav-btn.active { background: var(--nav-active); color: #fff; }
.nav-btn .count { margin-left: auto; font-size: 0.75rem; opacity: .6; }
#main { flex: 1; overflow-y: auto; padding: 20px; }
#section-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
#section-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card .en { font-weight: 700; font-size: 1rem; color: var(--text); flex: 1; }
.speak-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0 2px; opacity: 0.55; transition: opacity .15s, transform .1s; flex-shrink: 0; line-height: 1; }
.speak-btn:hover { opacity: 1; transform: scale(1.15); }
.card .fr { color: var(--primary); font-size: 0.92rem; margin-top: 4px; }
.card .note { color: var(--text-muted); font-size: 0.82rem; margin-top: 6px; font-style: italic; }
.card .theme-tag { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 0.72rem; padding: 2px 7px; border-radius: 20px; margin-top: 6px; }
#no-results { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 1rem; display: none; }
</style>
</head>

{id:"emergencies", label:"Emergencies", icon:"🚨", items:[
// === CARDIAC ARREST & RESUSCITATION ===
{en:"cardiac arrest",fr:"arrêt cardiaque",note:"confirmation: unresponsive + no normal breathing + no pulse"},
{en:"ventricular fibrillation (VF)",fr:"fibrillation ventriculaire",note:"shockable rhythm; defibrillate 200J biphasic immediately"},
{en:"pulseless ventricular tachycardia (pVT)",fr:"tachycardie ventriculaire sans pouls",note:"shockable; treat same as VF"},
{en:"asystole",fr:"asystolie",note:"non-shockable; epinephrine 1mg IV every 3–5 min"},
{en:"pulseless electrical activity (PEA)",fr:"activité électrique sans pouls (AESP)",note:"non-shockable; find reversible cause 4Hs/4Ts"},
{en:"cardiopulmonary resuscitation (CPR)",fr:"réanimation cardiopulmonaire (RCP)"},
{en:"chest compressions",fr:"compressions thoraciques",note:"30:2 ratio; 5–6cm depth; 100–120/min; allow full recoil"},
{en:"defibrillation",fr:"défibrillation",note:"200J biphasic first shock; resume CPR immediately after"},
{en:"automated external defibrillator (AED)",fr:"défibrillateur automatisé externe (DAE)"},
{en:"return of spontaneous circulation (ROSC)",fr:"récupération d'une activité circulatoire spontanée (RACS)"},
{en:"ACLS / ALS algorithm",fr:"algorithme de réanimation avancée (ACLS/SAU)"},
{en:"2-minute cycle",fr:"cycle de 2 minutes de RCP"},
{en:"shockable rhythm",fr:"rythme choquable"},
{en:"non-shockable rhythm",fr:"rythme non choquable"},
{en:"airway management",fr:"gestion des voies aériennes"},
{en:"advanced airway",fr:"dispositif avancé de gestion des voies aériennes",note:"ETT preferred; LMA acceptable during arrest"},
{en:"capnography during arrest",fr:"capnographie pendant la RCP",note:"EtCO2 >10mmHg suggests good CPR quality; sudden rise suggests ROSC"},
{en:"targeted temperature management (TTM)",fr:"hypothermie thérapeutique contrôlée",note:"post-ROSC; 32–36°C for 24h in comatose survivors"},
{en:"reversible causes 4Hs",fr:"causes réversibles 4H",note:"hypoxia/hypovolaemia/hypo-hyperkalaemia/hypothermia"},
{en:"reversible causes 4Ts",fr:"causes réversibles 4T",note:"tension pneumothorax/tamponade/thrombosis/toxins"},
// === ACLS DRUGS ===
{en:"epinephrine / adrenaline",fr:"épinéphrine / adrénaline",note:"1mg IV every 3–5 min for non-shockable; after 3rd shock for VF/pVT"},
{en:"amiodarone",fr:"amiodarone",note:"300mg IV after 3rd shock VF/pVT; 150mg after 5th shock"},
{en:"atropine",fr:"atropine",note:"0.5mg IV for bradycardia; no longer recommended for asystole/PEA"},
{en:"adenosine",fr:"adénosine",note:"6mg rapid IV for SVT; repeat 12mg if needed"},
{en:"sodium bicarbonate",fr:"bicarbonate de sodium",note:"50mmol IV for hyperkalaemia or TCA overdose in arrest"},
{en:"calcium chloride",fr:"chlorure de calcium",note:"10mL 10% IV for hyperkalaemia/hypocalcaemia/CCB OD"},
{en:"glucose 50%",fr:"glucose 50% (G50)",note:"25–50mL IV for hypoglycaemic arrest"},
{en:"magnesium sulfate",fr:"sulfate de magnésium",note:"2g IV for torsades de pointes or hypomagnesaemia"},
// === CRASH CART ===
{en:"crash cart / resuscitation trolley",fr:"chariot de réanimation / chariot d'urgence"},
{en:"code blue",fr:"code bleu (arrêt cardiorespiratoire)"},
{en:"bag-valve-mask (BVM / BAVU)",fr:"ballon autoremplisseur à valve unidirectionnelle (BAVU)"},
{en:"laryngoscope",fr:"laryngoscope"},
{en:"endotracheal tube (ETT)",fr:"sonde d'intubation endotrachéale"},
{en:"laryngeal mask airway (LMA)",fr:"masque laryngé"},
{en:"oropharyngeal airway (OPA / Guedel)",fr:"canule oropharyngée / canule de Guedel"},
{en:"nasopharyngeal airway (NPA)",fr:"canule nasopharyngée"},
{en:"suction device",fr:"aspirateur de mucosités"},
{en:"defibrillator / cardioverter",fr:"défibrillateur / cardioverteur"},
// === STROKE ===
{en:"stroke / cerebrovascular accident (CVA)",fr:"accident vasculaire cérébral (AVC)"},
{en:"FAST acronym",fr:"acronyme FAST",note:"Face drooping/Arm weakness/Speech difficulty/Time to call"},
{en:"ischaemic stroke",fr:"AVC ischémique",note:"85% of strokes; IV thrombolysis alteplase within 4.5h"},
{en:"haemorrhagic stroke",fr:"AVC hémorragique",note:"thrombolysis contraindicated"},
{en:"transient ischaemic attack (TIA)",fr:"accident ischémique transitoire (AIT)",note:"symptoms resolve <24h; ABCD2 score for risk stratification"},
{en:"NIHSS score",fr:"score NIHSS",note:"NIH Stroke Scale 0–42; guides thrombolysis decision"},
{en:"IV thrombolysis",fr:"thrombolyse intraveineuse",note:"alteplase 0.9mg/kg (max 90mg) within 4.5h; BP <185/110 required"},
{en:"mechanical thrombectomy",fr:"thrombectomie mécanique",note:"up to 24h for large vessel occlusion"},
{en:"stroke unit (UNV)",fr:"unité neuro-vasculaire (UNV)"},
{en:"penumbra",fr:"pénombre ischémique",note:"salvageable tissue surrounding core infarct"},
{en:"subarachnoid haemorrhage (SAH)",fr:"hémorragie sous-arachnoïdienne (HSA)",note:"thunderclap headache; CT then LP; aneurysm clipping/coiling"},
// === TRAUMA ===
{en:"polytrauma",fr:"polytraumatisme",note:"≥2 injuries; ISS >15"},
{en:"ABCDE primary survey",fr:"bilan primaire ABCDE"},
{en:"airway with C-spine control",fr:"voies aériennes + protection rachis cervical"},
{en:"breathing and ventilation",fr:"respiration et ventilation"},
{en:"circulation with haemorrhage control",fr:"circulation et contrôle hémorragique"},
{en:"disability / neurological status",fr:"état neurologique (Glasgow, AVPU, pupils)"},
{en:"exposure and environment",fr:"exposition et prévention hypothermie"},
{en:"secondary survey",fr:"bilan secondaire (tête aux pieds)"},
{en:"ATLS protocol",fr:"protocole ATLS (Advanced Trauma Life Support)"},
{en:"damage control resuscitation",fr:"réanimation hémostatique",note:"permissive hypotension SBP 80–90 until surgical control"},
{en:"massive transfusion protocol",fr:"protocole de transfusion massive",note:"ratio 1:1:1 PRBC:FFP:platelets"},
{en:"tournique / tourniquet",fr:"garrot",note:"apply 5–7cm above wound; note application time"},
{en:"haemostatic dressing",fr:"pansement hémostatique",note:"e.g. Celox/QuikClot for junctional bleeding"},
{en:"tension pneumothorax",fr:"pneumothorax suffocant",note:"emergency needle decompression 2nd ICS MCL, then chest drain"},
{en:"cardiac tamponade",fr:"tamponnade cardiaque",note:"Beck's triad: hypotension/JVD/muffled heart sounds; pericardiocentesis"},
{en:"traumatic brain injury (TBI)",fr:"traumatisme crânien",note:"maintain CPP >60mmHg; head of bed 30°; avoid hypoxia/hypotension"},
{en:"open fracture",fr:"fracture ouverte",note:"Gustilo classification I–IIIC; IV antibiotics within 1h"},
{en:"pelvic fracture",fr:"fracture du bassin",note:"can lose 2L+ blood; pelvic binder as temporising measure"},
{en:"REBOA",fr:"REBOA (Resuscitative Endovascular Balloon Occlusion of the Aorta)",note:"bridges to definitive haemostasis in non-compressible truncal haemorrhage"},
// === SHOCK ===
{en:"distributive shock",fr:"choc distributif",note:"septic/anaphylactic/neurogenic; vasodilation; high CO, low SVR"},
{en:"hypovolaemic shock",fr:"choc hypovolémique",note:"low preload; tachycardia; IV fluids/blood products"},
{en:"cardiogenic shock",fr:"choc cardiogénique",note:"pump failure; low CO; inotropes; consider IABP/VA-ECMO"},
{en:"obstructive shock",fr:"choc obstructif",note:"tension pneumo/tamponade/massive PE; treat underlying cause"},
{en:"anaphylactic shock",fr:"choc anaphylactique",note:"epinephrine 0.5mg IM anterolateral thigh as first-line"},
{en:"neurogenic shock",fr:"choc neurogène",note:"spinal injury; bradycardia + hypotension; vasopressors"},
{en:"septic shock",fr:"choc septique",note:"MAP <65 + vasopressors + lactate >2mmol/L despite fluid resus"},
{en:"shock index",fr:"indice de choc",note:"HR/SBP; >1 suggests significant haemorrhage"},
{en:"MAP (mean arterial pressure)",fr:"PAM (pression artérielle moyenne)",note:"target MAP ≥65mmHg in shock"},
{en:"norepinephrine",fr:"norépinéphrine / noradrénaline",note:"first-line vasopressor in septic shock"},
{en:"vasopressin",fr:"vasopressine",note:"second vasopressor in refractory septic shock"},
{en:"dopamine",fr:"dopamine",note:"alternative vasopressor; higher arrhythmia risk"},
// === ANAPHYLAXIS ===
{en:"anaphylaxis",fr:"anaphylaxie"},
{en:"angioedema",fr:"angio-œdème"},
{en:"urticaria",fr:"urticaire"},
{en:"bronchospasm in anaphylaxis",fr:"bronchospasme dans l'anaphylaxie"},
{en:"epinephrine auto-injector (EpiPen)",fr:"auto-injecteur d'adrénaline (EpiPen)"},
{en:"chlorphenamine",fr:"chlorphénamine (antihistaminique H1)"},
{en:"hydrocortisone",fr:"hydrocortisone",note:"200mg IV in anaphylaxis after epinephrine"},
// === POISONING / TOXICOLOGY ===
{en:"poisoning / intoxication",fr:"intoxication / empoisonnement"},
{en:"organophosphate poisoning",fr:"intoxication aux organophosphorés",note:"SLUDGE/DUMBELS; antidote: atropine + pralidoxime"},
{en:"opioid overdose",fr:"intoxication aux opioïdes",note:"naloxone 0.4mg IV/IM/IN; repeat every 2–3 min"},
{en:"benzodiazepine overdose",fr:"intoxication aux benzodiazépines",note:"flumazenil 0.2mg IV; risk of seizures; rarely used"},
{en:"paracetamol overdose",fr:"intoxication au paracétamol",note:"N-acetylcysteine; Rumack-Matthew nomogram"},
{en:"tricyclic antidepressant (TCA) OD",fr:"intoxication aux antidépresseurs tricycliques",note:"sodium bicarbonate for QRS >100ms; arrhythmia risk"},
{en:"carbon monoxide poisoning",fr:"intoxication au monoxyde de carbone (CO)",note:"100% O2 via NRB; consider hyperbaric oxygen"},
{en:"cyanide poisoning",fr:"intoxication au cyanure",note:"hydroxocobalamin 5g IV; also used in smoke inhalation"},
{en:"beta-blocker overdose",fr:"surdosage en bêtabloquants",note:"glucagon 5–10mg IV; high-dose insulin euglycaemia therapy"},
{en:"activated charcoal",fr:"charbon activé",note:"within 1h of ingestion if conscious and airway protected"},
{en:"gastric lavage",fr:"lavage gastrique",note:"rarely used; consider for life-threatening ingestion <1h"},
{en:"TOXBASE / poison control centre",fr:"centre antipoison (CAP)"},
// === BURNS ===
{en:"thermal burn",fr:"brûlure thermique"},
{en:"chemical burn",fr:"brûlure chimique"},
{en:"electrical burn",fr:"brûlure électrique"},
{en:"inhalation injury",fr:"brûlure des voies aériennes par inhalation",note:"early intubation; CO poisoning risk"},
{en:"rule of nines",fr:"règle des neuf (Pulaski et Tennison)",note:"head 9%/arm 9%/anterior trunk 18%/posterior trunk 18%/leg 18%/perineum 1%"},
{en:"Lund-Browder chart",fr:"tableau de Lund et Browder",note:"more accurate for children"},
{en:"Parkland formula",fr:"formule de Parkland",note:"4mL × weight(kg) × %TBSA; half in first 8h, rest over 16h"},
{en:"TBSA (total body surface area)",fr:"surface corporelle totale brûlée (SCB%)"},
{en:"superficial burn (1st degree)",fr:"brûlure superficielle (1er degré)",note:"epidermis only; erythema; heals in 3–5 days"},
{en:"partial thickness burn (2nd degree)",fr:"brûlure partielle (2ème degré)",note:"superficial: blisters; deep: pale/fixed staining"},
{en:"full thickness burn (3rd degree)",fr:"brûlure profonde (3ème degré)",note:"painless; leathery; skin grafting required"},
{en:"escharotomy",fr:"escharotomie",note:"circumferential full thickness burns causing compartment syndrome"},
// === TRIAGE SYSTEMS ===
{en:"triage",fr:"triage"},
{en:"START triage",fr:"triage START (Simple Triage And Rapid Treatment)",note:"respirations/perfusion/mental status assessment"},
{en:"SALT triage",fr:"triage SALT (Sort, Assess, Life-saving, Treatment)"},
{en:"Manchester Triage System (MTS)",fr:"tri de Manchester (MTS)",note:"5 categories: immediate/very urgent/urgent/standard/non-urgent"},
{en:"priority 1 / immediate (red)",fr:"urgence absolue (UA) / rouge",note:"life-threatening; airway/breathing/circulation compromise"},
{en:"priority 2 / urgent (orange/yellow)",fr:"urgence relative (UR) / orange–jaune",note:"serious but stable; can wait 30–60 min"},
{en:"priority 3 / delayed (green)",fr:"urgence différée / vert",note:"minor injuries; walking wounded"},
{en:"priority 4 / expectant (blue)",fr:"survie improbable / bleu",note:"unsurvivable injuries given available resources"},
{en:"deceased (black)",fr:"décédé / noir"},
{en:"mass casualty incident (MCI)",fr:"événement à victimes multiples (EVM)"},
{en:"incident command system (ICS)",fr:"poste de commandement (PC) / commandant des opérations de secours"},
// === ENVIRONMENTAL EMERGENCIES ===
{en:"heat stroke (classic / exertional)",fr:"coup de chaleur",note:"core temp >40°C + CNS dysfunction; cool immediately"},
{en:"hypothermia",fr:"hypothermie",note:"mild 32–35°C/moderate 28–32°C/severe <28°C; 'not dead until warm and dead'"},
{en:"drowning / near-drowning",fr:"noyade"},
{en:"electrocution",fr:"électrocution"},
{en:"lightning strike",fr:"foudroiement"},
{en:"altitude sickness (AMS)",fr:"mal des montagnes (MAM)",note:"HACE/HAPE above 2500m; descend immediately"},
]},

{id:"firstaid", label:"First Aid", icon:"🩹", items:[
// === BLS ALGORITHM ===
{en:"first aid",fr:"premiers secours"},
{en:"basic life support (BLS)",fr:"gestes de survie / soutien de base à la vie"},
{en:"chain of survival",fr:"chaîne de survie",note:"early recognition / call for help / early CPR / early defibrillation / post-resus care"},
{en:"check for danger",fr:"vérifier l'absence de danger",note:"scene safety before approaching"},
{en:"check for response",fr:"vérifier la réactivité",note:"shout + shoulder tap; AVPU scale"},
{en:"call for help / activate EMS",fr:"alerter les secours (15/18/112)"},
{en:"SAMU / 15",fr:"Service d'Aide Médicale Urgente (SAMU / 15)",note:"France emergency medical service; caller guided by dispatcher"},
{en:"open the airway",fr:"libérer les voies aériennes"},
{en:"head-tilt chin-lift",fr:"bascule de la tête avec élévation du menton"},
{en:"jaw thrust",fr:"subluxation de la mâchoire (si trauma C-spine)"},
{en:"look, listen, feel (LLF)",fr:"voir, entendre, sentir",note:"no more than 10 seconds to determine absent/abnormal breathing"},
{en:"agonal breathing",fr:"gasp / respiration agonique",note:"treat as absent breathing; start CPR"},
{en:"rescue breaths",fr:"insufflations / bouche-à-bouche",note:"1 second each; visible chest rise; 2 breaths after 30 compressions"},
{en:"chest compressions",fr:"compressions thoraciques",note:"lower half sternum; 5–6cm; 100–120/min; allow full recoil; minimise interruptions"},
{en:"30:2 ratio",fr:"ratio 30:2 (compressions:insufflations)"},
{en:"hands-only CPR",fr:"RCP sans bouche-à-bouche",note:"acceptable for untrained bystanders"},
{en:"AED / DAE steps",fr:"étapes d'utilisation du DAE",note:"power on / attach pads / analyse / follow prompts / shock if advised / resume CPR"},
{en:"non-shockable rhythm",fr:"rythme non choquable",note:"continue CPR; AED instructs to continue"},
{en:"recovery position (lateral safety position)",fr:"position latérale de sécurité (PLS)",note:"unconscious breathing patient; prevents aspiration"},
// === CHOKING (AIRWAY OBSTRUCTION) ===
{en:"choking",fr:"étouffement / obstruction des voies aériennes"},
{en:"mild obstruction",fr:"obstruction partielle",note:"encourage coughing; do not intervene"},
{en:"severe obstruction",fr:"obstruction complète",note:"cannot speak/breathe/cough; act immediately"},
{en:"5 back blows",fr:"5 claques dans le dos",note:"firm blows between shoulder blades with heel of hand"},
{en:"5 abdominal thrusts (Heimlich)",fr:"5 compressions abdominales (manœuvre de Heimlich)",note:"upward thrusts above navel; alternate with back blows"},
{en:"infant choking",fr:"nourrisson qui s'étouffe",note:"5 back blows face-down + 5 chest thrusts (NOT abdominal)"},
{en:"unconscious choking",fr:"étouffement avec perte de connaissance",note:"place on ground; start CPR; look in mouth before each breath"},
// === BLEEDING CONTROL ===
{en:"bleeding control",fr:"contrôle de l'hémorragie"},
{en:"direct pressure",fr:"compression directe",note:"firm continuous pressure with clean cloth for ≥10 min"},
{en:"wound packing",fr:"méchage de plaie",note:"for deep wounds; pack tightly with gauze"},
{en:"tourniquet",fr:"garrot",note:"for life-threatening limb haemorrhage only; note time; do not remove"},
{en:"elevation",fr:"élévation du membre",note:"raise injured limb above heart level"},
{en:"pressure point",fr:"point de compression",note:"proximal artery compression (femoral/brachial)"},
{en:"haemostatic dressing",fr:"pansement hémostatique"},
{en:"nose bleed (epistaxis)",fr:"saignement de nez (épistaxis)",note:"sit forward, pinch soft part of nose 10–15 min"},
{en:"wound irrigation",fr:"lavage de la plaie",note:"clean water or saline; remove visible debris"},
{en:"tetanus prophylaxis",fr:"prophylaxie antitétanique",note:"check vaccination status for contaminated wounds"},
// === BURNS FIRST AID ===
{en:"burn first aid",fr:"premiers secours pour brûlures"},
{en:"cool with running water",fr:"refroidir à l'eau courante",note:"15–20 min; water 15°C; start within 3h; prevents deepening"},
{en:"do NOT use ice",fr:"ne PAS utiliser de glace",note:"causes vasoconstriction and deepens burn"},
{en:"cover the burn",fr:"couvrir la brûlure",note:"non-adherent cling film or sterile dressing"},
{en:"chemical burn irrigation",fr:"lavage de brûlure chimique",note:"copious irrigation ≥20 min; brush off dry chemicals first"},
{en:"remove jewellery / clothing",fr:"retirer bijoux et vêtements",note:"around burn area; do not remove if stuck"},
// === FRACTURES & MUSCULOSKELETAL ===
{en:"fracture first aid",fr:"premiers secours pour fractures"},
{en:"immobilise",fr:"immobiliser",note:"splint in position found; include joint above and below"},
{en:"open / compound fracture",fr:"fracture ouverte",note:"cover with sterile dressing; do not attempt to reduce"},
{en:"RICE mnemonic",fr:"protocole RICE",note:"Rest/Ice/Compression/Elevation for sprains"},
{en:"neurovascular check",fr:"bilan neurovasculaire",note:"pulse, sensation, movement distal to injury"},
// === MEDICAL EMERGENCIES ===
{en:"seizure management",fr:"conduite à tenir devant une crise convulsive",note:"protect from injury; time seizure; recovery position post-ictal; call 15 if >5 min"},
{en:"diabetic emergency (hypoglycaemia)",fr:"urgence diabétique (hypoglycémie)",note:"conscious: 15g fast-acting sugar; repeat in 15 min if no improvement"},
{en:"diabetic emergency (hyperglycaemia)",fr:"urgence diabétique (hyperglycémie)",note:"call SAMU; keep patient calm; IV fluids if possible"},
{en:"stroke recognition (FAST)",fr:"reconnaissance AVC (VITE)",note:"Visage/bras/trouble de la parole/Téléphoner le 15"},
{en:"anaphylaxis first aid",fr:"premiers secours anaphylaxie",note:"epinephrine auto-injector IM thigh; lie flat legs raised; call 15"},
{en:"asthma attack first aid",fr:"premiers secours crise d'asthme",note:"sit upright; use reliever inhaler; call 15 if no improvement"},
{en:"poisoning first aid",fr:"premiers secours intoxication",note:"call Centre Antipoison (CAP); do NOT induce vomiting"},
{en:"drowning rescue",fr:"sauvetage noyade",note:"remove from water safely; start BLS if not breathing"},
{en:"hypothermia first aid",fr:"premiers secours hypothermie",note:"move to warm environment; remove wet clothing; insulate; warm fluids if conscious"},
{en:"heat exhaustion",fr:"épuisement par chaleur",note:"cool, shade, fluids; differentiate from heat stroke (confusion)"},
{en:"fainting (vasovagal syncope)",fr:"malaise vagal / syncope",note:"lay flat; raise legs; do not give food/drink until fully alert"},
// === PEDIATRIC BLS ===
{en:"paediatric BLS",fr:"réanimation cardiopulmonaire pédiatrique",note:"5 rescue breaths first; then 15:2 for HCPs; 30:2 for lay rescuers"},
{en:"infant CPR",fr:"RCP nourrisson",note:"2 fingers for compressions; depth 4cm; 100–120/min"},
{en:"child CPR",fr:"RCP enfant (1 an – puberté)",note:"1 or 2 hands; depth 5cm"},
{en:"paediatric defibrillation",fr:"défibrillation pédiatrique",note:"4J/kg; use paediatric pads if available for <8 years"},
// === CALLING FOR HELP ===
{en:"emergency services (15/18/112)",fr:"services de secours (15/18/112)",note:"15 SAMU / 18 sapeurs-pompiers / 112 numéro européen"},
{en:"call 15 (SAMU)",fr:"appeler le 15 (SAMU)"},
{en:"call 18 (fire & rescue)",fr:"appeler le 18 (sapeurs-pompiers)"},
{en:"call 112",fr:"appeler le 112 (numéro d'urgence européen)"},
{en:"structured emergency call",fr:"appel d'urgence structuré",note:"who / where / what happened / how many victims / current state"},
]},

{id:"medication", label:"Medication", icon:"💊", items:[
// === PRESCRIPTION & ADMINISTRATION ===
{en:"prescription",fr:"ordonnance"},
{en:"dose",fr:"dose"},
{en:"dosage / posology",fr:"posologie"},
{en:"route of administration",fr:"voie d'administration"},
{en:"oral (PO)",fr:"voie orale (per os)"},
{en:"intravenous (IV)",fr:"voie intraveineuse (IV)"},
{en:"intramuscular (IM)",fr:"voie intramusculaire (IM)"},
{en:"subcutaneous (SC)",fr:"voie sous-cutanée (SC)"},
{en:"sublingual (SL)",fr:"voie sublinguale"},
{en:"topical / local",fr:"voie locale / topique"},
{en:"inhalation",fr:"voie inhalatoire"},
{en:"transdermal patch",fr:"patch transdermique"},
{en:"rectal (PR / suppository)",fr:"voie rectale / suppositoire"},
{en:"intrathecal",fr:"voie intrathécale (dans le LCS)"},
{en:"intraosseous (IO)",fr:"voie intraosseuse (IO)",note:"emergency access when IV unavailable; EZ-IO drill"},
{en:"nebulisation",fr:"nébulisation"},
{en:"metered-dose inhaler (MDI)",fr:"aérosol-doseur (pMDI)"},
{en:"dry powder inhaler (DPI)",fr:"inhalateur à poudre sèche"},
{en:"spacer / holding chamber",fr:"chambre d'inhalation (Babyhaler, Volumatic)"},
// === MEDICATION SAFETY (5 RIGHTS) ===
{en:"5 rights of medication",fr:"5 bonnes règles du médicament",note:"bon patient / bon médicament / bonne dose / bonne voie / bon moment"},
{en:"right patient",fr:"bon patient",note:"check ID band + date of birth; ask patient name"},
{en:"right drug",fr:"bon médicament"},
{en:"right dose",fr:"bonne dose"},
{en:"right route",fr:"bonne voie"},
{en:"right time",fr:"bon moment"},
{en:"double check (double contrôle)",fr:"double contrôle indépendant",note:"required for high-risk medications: insulins, heparin, chemotherapy"},
{en:"high-alert medication",fr:"médicament à risque élevé (LASA)"},
{en:"LASA (look-alike sound-alike) drugs",fr:"médicaments à consonance ou apparence semblable"},
{en:"medication administration record (MAR)",fr:"plan de soins médicamenteux / feuille de traitement"},
{en:"medication reconciliation",fr:"conciliation médicamenteuse"},
// === ANALGESICS ===
{en:"WHO analgesic ladder",fr:"paliers analgésiques de l'OMS",note:"step 1: non-opioid / step 2: weak opioid / step 3: strong opioid"},
{en:"paracetamol / acetaminophen",fr:"paracétamol",note:"1g QID max; hepatotoxic in overdose or liver disease"},
{en:"NSAID (non-steroidal anti-inflammatory)",fr:"AINS (anti-inflammatoire non stéroïdien)",note:"ibuprofen/diclofenac/naproxen; avoid in renal failure/peptic ulcer"},
{en:"COX-2 inhibitor",fr:"inhibiteur sélectif de la COX-2",note:"celecoxib; lower GI risk but cardiovascular risk"},
{en:"weak opioid",fr:"opioïde faible",note:"codeine/tramadol; step 2 WHO ladder"},
{en:"strong opioid",fr:"opioïde fort",note:"morphine/oxycodone/fentanyl; step 3 WHO ladder"},
{en:"morphine",fr:"morphine",note:"immediate release 4-hourly or modified release 12-hourly; conversion: oral:IV = 3:1"},
{en:"fentanyl",fr:"fentanyl",note:"IV/transdermal/buccal; 100× more potent than morphine"},
{en:"oxycodone",fr:"oxycodone"},
{en:"hydromorphone",fr:"hydromorphone",note:"5–7× more potent than morphine; used when morphine not tolerated"},
{en:"tramadol",fr:"tramadol",note:"weak opioid + SNRI; risk of seizures; serotonin syndrome with SSRIs"},
{en:"naloxone",fr:"naloxone (Narcan)",note:"opioid antagonist; 0.4mg IV/IM; repeat every 2–3 min"},
{en:"patient-controlled analgesia (PCA)",fr:"analgésie contrôlée par le patient (PCA)"},
// === ANTIBIOTICS ===
{en:"antibiotic",fr:"antibiotique"},
{en:"beta-lactam antibiotic",fr:"antibiotique bêta-lactamine"},
{en:"penicillin (benzylpenicillin, amoxicillin)",fr:"pénicilline (benzylpénicilline, amoxicilline)",note:"gram-positive coverage; amoxicillin + clavulanate = Augmentin"},
{en:"piperacillin-tazobactam (Tazocin)",fr:"pipéracilline-tazobactam (Tazocin)",note:"broad spectrum; Pseudomonas coverage"},
{en:"cephalosporin",fr:"céphalosporine",note:"1st–5th generation; cefazolin (surgical prophylaxis)/ceftriaxone (meningitis)"},
{en:"carbapenem",fr:"carbapénème",note:"meropenem/imipenem; last resort for MDR gram-negatives"},
{en:"glycopeptide",fr:"glycopeptide",note:"vancomycin/teicoplanin; MRSA coverage; monitor levels"},
{en:"macrolide",fr:"macrolide",note:"azithromycin/clarithromycin/erythromycin; atypical pneumonia"},
{en:"fluoroquinolone",fr:"fluoroquinolone",note:"ciprofloxacin/levofloxacin; avoid in tendon disease; QT prolongation"},
{en:"aminoglycoside",fr:"aminoside",note:"gentamicin/amikacin; concentration-dependent; nephrotoxic + ototoxic; monitor levels"},
{en:"metronidazole",fr:"métronidazole (Flagyl)",note:"anaerobes/C.difficile/Trichomonas; disulfiram-like with alcohol"},
{en:"trimethoprim-sulfamethoxazole (co-trimoxazole)",fr:"triméthoprime-sulfaméthoxazole (Bactrim)",note:"UTI/PJP prophylaxis; avoid in allergy"},
{en:"antifungal (azole/echinocandin/polyene)",fr:"antifongique (azolé/échinocandine/polyène)",note:"fluconazole/caspofungin/amphotericin B"},
{en:"antiviral",fr:"antiviral",note:"aciclovir (HSV/VZV)/oseltamivir (influenza)/remdesivir (SARS-CoV-2)"},
{en:"antibiotic resistance",fr:"antibiorésistance"},
{en:"MRSA (methicillin-resistant Staphylococcus aureus)",fr:"SARM (Staphylococcus aureus résistant à la méticilline)"},
{en:"VRE (vancomycin-resistant enterococcus)",fr:"ERV (entérocoque résistant à la vancomycine)"},
{en:"ESBL (extended-spectrum beta-lactamase)",fr:"BLSE (bêta-lactamase à spectre étendu)"},
{en:"de-escalation of antibiotics",fr:"désescalade antibiotique"},

{en:"ACE inhibitor (ACEI)",fr:"inhibiteur de l'enzyme de conversion (IEC)",note:"enalapril/ramipril/lisinopril; cough side effect; avoid in pregnancy"},
{en:"angiotensin receptor blocker (ARB)",fr:"antagoniste des récepteurs de l'angiotensine (ARA II)",note:"losartan/valsartan; less cough than ACEI"},
{en:"beta-blocker",fr:"bêtabloquant",note:"metoprolol/bisoprolol/atenolol/carvedilol; HR reduction; bronchospasm risk"},
{en:"calcium channel blocker (CCB)",fr:"inhibiteur calcique (IC)",note:"amlodipine (DHP)/diltiazem/verapamil (non-DHP rate control)"},
{en:"loop diuretic",fr:"diurétique de l'anse",note:"furosemide (Lasilix); monitor electrolytes; ototoxic in high doses"},
{en:"thiazide diuretic",fr:"diurétique thiazidique",note:"hydrochlorothiazide/indapamide; hypertension"},
{en:"potassium-sparing diuretic",fr:"diurétique épargneur de potassium",note:"spironolactone/eplerenone; monitor K+ / renal function"},
{en:"digoxin",fr:"digoxine",note:"narrow therapeutic index; toxicity: nausea/bradycardia/visual changes; level 0.5–0.9 ng/mL"},
{en:"nitrate",fr:"dérivé nitré",note:"GTN spray (angina) / IV GTN (hypertensive emergency / APO)"},
{en:"statin",fr:"statine",note:"atorvastatin/rosuvastatin; myopathy risk; monitor CK/LFTs"},
{en:"anticoagulant",fr:"anticoagulant"},
{en:"unfractionated heparin (UFH)",fr:"héparine non fractionnée (HNF)",note:"IV infusion; monitor aPTT; antidote: protamine sulfate"},
{en:"low-molecular-weight heparin (LMWH)",fr:"héparine de bas poids moléculaire (HBPM)",note:"enoxaparin (Lovenox); SC injection; anti-Xa monitoring in renal failure"},
{en:"warfarin",fr:"warfarine (Coumadine)",note:"vitamin K antagonist; monitor INR; many interactions; antidote: vitamin K/PCC/FFP"},
{en:"DOAC / NOAC",fr:"anticoagulant oral direct (AOD)",note:"dabigatran/rivaroxaban/apixaban/edoxaban; no routine monitoring; reversal agents available"},
{en:"dabigatran antidote",fr:"antidote du dabigatran",note:"idarucizumab (Praxbind) 5g IV"},
{en:"factor Xa inhibitor antidote",fr:"antidote des anti-Xa",note:"andexanet alfa (Ondexxya) for rivaroxaban/apixaban"},
{en:"antiplatelet",fr:"antiagrégant plaquettaire",note:"aspirin 75–300mg / clopidogrel (Plavix) / ticagrelor (Brilique) / prasugrel"},
{en:"dual antiplatelet therapy (DAPT)",fr:"double antiagrégation plaquettaire (DAPT)",note:"aspirin + P2Y12 inhibitor; 12 months post-ACS/stenting"},
// === ANTIARRHYTHMICS ===
{en:"antiarrhythmic class I (Na channel blockers)",fr:"antiarythmique classe I (bloqueurs canaux Na+)",note:"flecainide/lidocaine/propafenone"},
{en:"antiarrhythmic class II (beta-blockers)",fr:"antiarythmique classe II (bêtabloquants)"},
{en:"antiarrhythmic class III (K channel blockers)",fr:"antiarythmique classe III (bloqueurs canaux K+)",note:"amiodarone/sotalol; QT prolongation"},
{en:"antiarrhythmic class IV (CCB)",fr:"antiarythmique classe IV (inhibiteurs calciques)"},
{en:"amiodarone",fr:"amiodarone (Cordarone)",note:"broad spectrum; thyroid/lung/liver/skin toxicity; monitor TFT/LFT/CXR"},
{en:"adenosine",fr:"adénosine (Striadyne)",note:"6mg rapid IV for SVT; very short half-life ~10s"},

{en:"benzodiazepine",fr:"benzodiazépine",note:"diazepam/lorazepam/midazolam; GABA-A agonist; sedation/seizure/anxiety"},
{en:"SSRI (selective serotonin reuptake inhibitor)",fr:"ISRS (inhibiteur sélectif de la recapture de la sérotonine)",note:"fluoxetine/sertraline/escitalopram; 2–4 weeks onset; serotonin syndrome risk"},
{en:"SNRI",fr:"IRSNa (inhibiteur recapture sérotonine-noradrénaline)",note:"venlafaxine/duloxetine; also for neuropathic pain"},
{en:"tricyclic antidepressant (TCA)",fr:"antidépresseur tricyclique (ATC)",note:"amitriptyline/nortriptyline; cardiac toxicity in OD; anticholinergic SE"},
{en:"antiepileptic drug (AED)",fr:"antiépileptique",note:"valproate/levetiracetam/lamotrigine/phenytoin/carbamazepine; monitor levels"},
{en:"antipsychotic (typical)",fr:"antipsychotique typique (1ère génération)",note:"haloperidol/chlorpromazine; EPS risk (dystonia/akathisia/parkinsonism/tardive dyskinesia)"},
{en:"antipsychotic (atypical)",fr:"antipsychotique atypique (2ème génération)",note:"olanzapine/quetiapine/risperidone/clozapine; metabolic syndrome risk"},
{en:"clozapine",fr:"clozapine (Leponex)",note:"treatment-resistant schizophrenia; agranulocytosis risk; mandatory WBC monitoring"},
{en:"lithium",fr:"lithium",note:"bipolar disorder; narrow TI (0.6–1.0 mEq/L); toxicity: tremor/polyuria/ataxia/seizures"},

{en:"insulin (rapid-acting)",fr:"insuline rapide",note:"lispro/aspart/glulisine; onset 10–15 min; meal-time"},
{en:"insulin (short-acting)",fr:"insuline ordinaire / regular",note:"Actrapid; IV infusion in DKA/HHS"},

{id:"prevention", label:"Prevention & Nutrition", icon:"🥗", items:[
// === HAND HYGIENE ===
{en:"hand hygiene",fr:"hygiène des mains"},

{en:"hand washing with soap and water",fr:"lavage des mains à l'eau et au savon",note:"mandatory for C.difficile/norovirus/gross soiling"},

{en:"personal protective equipment (PPE)",fr:"équipement de protection individuelle (EPI)"},
{en:"standard precautions",fr:"précautions standard (PS)",note:"apply to ALL patients regardless of known infection status"},

{en:"droplet precautions",fr:"précautions gouttelettes",note:"influenza/COVID/meningitis; surgical mask; 1–2m distance"},

{en:"gloves",fr:"gants non stériles / stériles"},
{en:"fluid-resistant gown",fr:"surblouse / blouse imperméable"},
{en:"eye protection / face shield",fr:"lunettes de protection / visière"},
{en:"apron",fr:"tablier"},

{en:"cohorting",fr:"cohorting / regroupement de patients"},

{en:"CLABSI (central line bloodstream infection)",fr:"bactériémie sur cathéter veineux central (BACC)"},

{en:"SSI (surgical site infection)",fr:"infection du site opératoire (ISO)"},

{en:"sterile technique",fr:"technique stérile / asepsie chirurgicale"},
{en:"clean technique",fr:"technique propre / asepsie médicale"},
{en:"antiseptic",fr:"antiseptique",note:"chlorhexidine/PVP-iodine/alcohol; used on living tissue"},
{en:"disinfectant",fr:"désinfectant",note:"used on surfaces/instruments; not on skin"},
{en:"disinfection",fr:"désinfection",note:"high-level disinfection kills most pathogens including mycobacteria"},
{en:"sterilisation",fr:"stérilisation",note:"kills ALL including spores; autoclave steam/ethylene oxide/plasma"},
{en:"decontamination",fr:"décontamination"},
{en:"single-use device",fr:"dispositif à usage unique (DUU)"},

{en:"herd immunity",fr:"immunité collective (immunité de groupe)"},
{en:"live attenuated vaccine",fr:"vaccin vivant atténué",note:"MMR/varicella/BCG/rotavirus; contraindicated in immunocompromised"},
{en:"inactivated vaccine",fr:"vaccin inactivé",note:"influenza/hepatitis A/polio IPV; safe in immunocompromised"},
{en:"subunit / recombinant vaccine",fr:"vaccin sous-unité / recombinant",note:"HBV/pertussis/pneumococcal/meningococcal/HPV"},

{en:"hypertension screening",fr:"dépistage de l'hypertension artérielle"},
{en:"lipid screening",fr:"dépistage des dyslipidémies (bilan lipidique)"},

{en:"minerals / micronutrients",fr:"minéraux / micronutriments"},

]},

// === GYNAECOLOGICAL CONDITIONS ===
{en:"endometriosis",fr:"endométriose",note:"ectopic endometrial tissue; cyclic pain/dyspareunia/infertility; laparoscopy gold standard"},
{en:"polycystic ovary syndrome (PCOS)",fr:"syndrome des ovaires polykystiques (SOPK)",note:"Rotterdam criteria: 2 of 3 – oligo-ovulation/hyperandrogenaemia/PCO on USS"},
{en:"uterine fibroids / leiomyomata",fr:"fibromes utérins / léiomyomes",note:"submucosal/intramural/subserosal; HMB/pressure symptoms/subfertility"},
{en:"adenomyosis",fr:"adénomyose",note:"endometrial glands in myometrium; diffusely enlarged uterus; dysmenorrhoea"},
{en:"ovarian cyst",fr:"kyste ovarien",note:"functional/dermoid/endometrioma/malignant; USS ± CA-125"},
{en:"polycystic ovaries",fr:"ovaires polykystiques (OPK)",note:"≥12 antral follicles per ovary or ovarian volume >10mL"},
{en:"vulvodynia",fr:"vulvodynie",note:"chronic vulvar pain without identifiable cause; allodynia"},
{en:"vaginismus",fr:"vaginisme",note:"involuntary pelvic floor spasm; psychosexual therapy/dilators"},
{en:"bacterial vaginosis (BV)",fr:"vaginose bactérienne",note:"Gardnerella; fishy odour; grey discharge; Amsel criteria; metronidazole"},
{en:"vulvovaginal candidiasis",fr:"candidose vulvo-vaginale",note:"Candida albicans; white curd discharge; pruritus; clotrimazole/fluconazole"},
{en:"trichomoniasis",fr:"trichomonase",note:"Trichomonas vaginalis; yellow-green frothy discharge; STI; metronidazole"},
{en:"atrophic vaginitis",fr:"vaginite atrophique (syndrome génito-urinaire de la ménopause)"},
{en:"pelvic inflammatory disease (PID)",fr:"infection génitale haute (IGH) / salpingite",note:"ascending STI; fever/adnexal tenderness; ceftriaxone+doxycycline+metronidazole"},
{en:"ectopic pregnancy",fr:"grossesse extra-utérine (GEU)",note:"95% Fallopian tube; risk factors: PID/IUD/previous ectopic; BHCG+USS"},
{en:"uterine polyp",fr:"polype utérin"},
{en:"Bartholin's cyst / abscess",fr:"kyste / abcès de Bartholin"},
// === CONTRACEPTION ===
{en:"contraception",fr:"contraception"},
{en:"combined oral contraceptive pill (COC)",fr:"pilule oestroprogestative",note:"oestrogen+progestogen; Pearl index <1; risk VTE/CI in migraine with aura"},
{en:"progestogen-only pill (POP / mini-pill)",fr:"pilule microprogestative (microprogestatif)",note:"Cerazette/Desogestrel; safe in breastfeeding/VTE risk/age >35+smoker"},
{en:"hormonal IUD (LNG-IUS)",fr:"DIU hormonal (stérilet hormonal / Mirena)",note:"levonorgestrel; 5-year; reduces HMB; anovulation not guaranteed"},
{en:"copper IUD",fr:"DIU cuivré / stérilet cuivré",note:"non-hormonal; 5–10 years; spermicidal; best emergency contraception up to 5 days"},
{en:"contraceptive implant",fr:"implant contraceptif (Nexplanon)",note:"etonogestrel; 3-year; effective day 1; irregular bleeding common"},
{en:"injectable contraceptive (DMPA)",fr:"contraception injectable (Dépo-Provera)",note:"medroxyprogesterone; 3-monthly; delayed return to fertility"},
{en:"contraceptive patch",fr:"patch contraceptif",note:"oestrogen+progestogen; weekly; same risks as COC"},
{en:"vaginal ring",fr:"anneau vaginal (NuvaRing)",note:"monthly; same hormones as COC; worn 21 days"},
{en:"barrier methods",fr:"méthodes barrières",note:"male condom (only STI protection) / female condom / diaphragm / cap"},
{en:"emergency contraception (levonorgestrel)",fr:"contraception d'urgence (Norlevo)",note:"1.5mg within 72h; 95% effective in first 24h; reduces with time"},
{en:"ulipristal acetate (EllaOne)",fr:"ulipristal acétate (EllaOne)",note:"emergency contraception within 120h; equally effective over 5 days"},
{en:"copper IUD as emergency contraception",fr:"DIU cuivré en urgence",note:"most effective EC; within 5 days; >99% effective"},
{en:"sterilisation (tubal ligation / vasectomy)",fr:"stérilisation (ligature des trompes / vasectomie)"},
{en:"natural family planning",fr:"planning familial naturel",note:"fertility awareness; Billings/symptothermal methods"},
// === GYNAECOLOGICAL ONCOLOGY ===
{en:"cervical cancer (HPV-related)",fr:"cancer du col de l'utérus (lié au HPV)",note:"HPV 16/18 cause 70%; FIGO staging I–IV; prevent with HPV vaccine"},
{en:"CIN (cervical intraepithelial neoplasia)",fr:"néoplasie intraépithéliale cervicale (CIN)",note:"CIN1/2/3; CIN3 = carcinoma in situ; LLETZ/cone biopsy treatment"},
{en:"endometrial cancer",fr:"cancer de l'endomètre",note:"most common gynaecological cancer in developed world; type I (oestrogen-driven) vs type II"},
{en:"ovarian cancer",fr:"cancer de l'ovaire",note:"CA-125 + USS; poor prognosis due to late presentation; BRCA1/2 risk"},
{en:"vulvar cancer",fr:"cancer de la vulve",note:"SCC commonest; HPV-related in younger/VIN in older women; FIGO staging"},
{en:"CA-125 tumour marker",fr:"marqueur tumoral CA-125",note:"elevated in ovarian cancer; also in endometriosis/PID/pregnancy"},
{en:"HPV vaccination",fr:"vaccination contre le papillomavirus (HPV)",note:"Gardasil 9; boys and girls 11–14 years in France; prevents CIN/cervical cancer"},
// === GYNAECOLOGICAL PROCEDURES ===
{en:"cervical smear / Pap smear",fr:"frottis cervico-vaginal (FCV)"},
{en:"colposcopy",fr:"colposcopie",note:"after abnormal smear; acetic acid whitening; biopsy if abnormal"},
{en:"LLETZ / LEEP",fr:"conisation au bistouri électrique (LLETZ/RDE)",note:"loop excision; treats CIN 2–3; preserve fertility"},
{en:"cone biopsy",fr:"conisation au bistouri froid / laser"},
{en:"hysteroscopy",fr:"hystéroscopie",note:"diagnostic + operative; polyps/fibroids/asherman's; outpatient/GA"},
{en:"laparoscopy",fr:"cœlioscopie / laparoscopie",note:"diagnostic + operative; keyhole surgery; CO2 insufflation"},
{en:"D&C (dilatation and curettage)",fr:"curetage / aspiration utérine",note:"miscarriage/incomplete abortion/endometrial sampling"},
{en:"hysterectomy",fr:"hystérectomie",note:"total (uterus+cervix) / subtotal / radical (Wertheim); abdominal/vaginal/laparoscopic"},
{en:"oophorectomy",fr:"ovariectomie",note:"unilateral or bilateral; surgical menopause if bilateral before natural"},
{en:"salpingectomy",fr:"salpingectomie",note:"Fallopian tube removal; bilateral reduces ovarian cancer risk"},
{en:"myomectomy",fr:"myomectomie",note:"fibroid removal; fertility-preserving"},
{en:"transvaginal ultrasound (TVS)",fr:"échographie endovaginale (EEV)",note:"first-line USS for pelvic pathology; superior to abdominal in obese"},
{en:"pelvic examination",fr:"examen gynécologique / examen pelvien"},
{en:"bimanual examination",fr:"toucher vaginal (TV) bimanuel"},
{en:"speculum examination",fr:"examen au speculum"},
]},

{id:"obstetrics", label:"Obstetrics", icon:"🤰", items:[
// === ANTENATAL CARE ===
{en:"pregnancy",fr:"grossesse"},
{en:"antenatal / prenatal care",fr:"suivi de grossesse / soins prénataux"},
{en:"booking appointment",fr:"consultation de début de grossesse",note:"ideally <12 weeks; BP/urine/weight/bloods/history"},
{en:"first trimester (weeks 1–13)",fr:"premier trimestre (SA 1–13)"},
{en:"second trimester (weeks 14–27)",fr:"deuxième trimestre (SA 14–27)"},
{en:"third trimester (weeks 28–41)",fr:"troisième trimestre (SA 28–41)"},
{en:"gestational age (weeks of amenorrhoea)",fr:"âge gestationnel (semaines d'aménorrhée – SA)"},
{en:"estimated due date (EDD)",fr:"date prévue d'accouchement (DPA)"},
{en:"dating scan (11–13+6 weeks)",fr:"échographie de datation (11–13 SA)",note:"confirms dates; nuchal translucency (NT) measurement"},
{en:"nuchal translucency (NT)",fr:"clarté nucale (CN)",note:"NT >3.5mm: increased Down's syndrome / cardiac risk"},
{en:"combined first trimester screening",fr:"dépistage combiné du 1er trimestre",note:"NT + PAPP-A + beta-hCG + age; trisomy 21/18/13"},
{en:"NIPT (non-invasive prenatal testing)",fr:"test prénatal non invasif (TPNI / DPNI)"},
{en:"anomaly scan (20–22 weeks)",fr:"échographie morphologique (22 SA en France)"},
{en:"symphysis-fundal height (SFH)",fr:"hauteur utérine (HU)",note:"=gestational age in cm from 24 weeks; assess growth"},
{en:"foetus / fetus",fr:"fœtus"},
{en:"placenta",fr:"placenta",note:"Grade 0–3 on USS; grade III = maturity"},
{en:"umbilical cord",fr:"cordon ombilical",note:"2 arteries + 1 vein; single umbilical artery: screen for anomalies"},
{en:"amniotic fluid",fr:"liquide amniotique",note:"AFI 5–25cm normal; oligohydramnios <5 / polyhydramnios >25"},
{en:"amniotic sac / membranes",fr:"poche des eaux / membranes amniotiques"},
{en:"Group B Streptococcus (GBS) screening",fr:"dépistage streptocoque B",note:"vaginal+rectal swab at 35–37 weeks; IV penicillin in labour if positive"},
{en:"OGTT (oral glucose tolerance test)",fr:"hyperglycémie provoquée par voie orale (HGPO)",note:"75g glucose at 24–28 weeks; normal: 0h <5.1 / 1h <10 / 2h <8.5 mmol/L"},
{en:"pre-eclampsia screening",fr:"dépistage de la pré-éclampsie",note:"aspirin 150mg from 12 weeks if high risk (BP/MAP/PAPP-A/uterine artery PI)"},
{en:"amniocentesis",fr:"amniocentèse",note:"15–20 weeks; karyotype/microarray; 0.5–1% miscarriage risk"},
{en:"chorionic villus sampling (CVS)",fr:"biopsie du trophoblaste (BT)",note:"11–13 weeks; earlier result; 1–2% miscarriage risk"},
// === LABOUR ===
{en:"labour",fr:"travail obstétrical"},
{en:"latent phase of labour",fr:"phase de latence du travail",note:"contractions irregular; cervix 0–4cm dilated; can last hours–days"},
{en:"active phase of labour",fr:"phase active du travail",note:"regular contractions ≥3 in 10 min; cervix 4–10cm; progress ≥0.5cm/h"},
{en:"transition phase",fr:"phase de transition",note:"7–10cm; most intense contractions; urge to push"},
{en:"second stage of labour",fr:"deuxième stade du travail",note:"fully dilated to delivery; passive + active pushing"},
{en:"third stage of labour",fr:"troisième stade du travail (délivrance)",note:"delivery of placenta; AMTSL (active management) vs expectant"},
{en:"active management of 3rd stage (AMTSL)",fr:"délivrance dirigée",note:"oxytocin 10 IU IM immediately after birth; controlled cord traction"},
{en:"uterine contractions",fr:"contractions utérines"},
{en:"cervical dilation",fr:"dilatation cervicale",note:"0–10cm; complete = 10cm"},
{en:"cervical effacement",fr:"effacement cervical",note:"0–100%; shortening and thinning of cervix"},
{en:"fetal station",fr:"engagement / hauteur de présentation",note:"from -5 to +5 relative to ischial spines; 0 = engaged"},
{en:"Bishop score",fr:"score de Bishop",note:"0–13; dilation/effacement/station/consistency/position; ≥6 favourable for induction"},
{en:"artificial rupture of membranes (ARM / amniotomy)",fr:"rupture artificielle des membranes (RAM)"},
{en:"oxytocin augmentation",fr:"ocytocine (Syntocinon) en perfusion",note:"IV titration; continuous CTG monitoring required"},
{en:"epidural anaesthesia",fr:"analgésie péridurale",note:"lumbar epidural; patient-controlled epidural analgesia (PCEA)"},
{en:"nitrous oxide (MEOPA / Entonox)",fr:"protoxyde d'azote / MEOPA",note:"50:50 N2O/O2; self-administered; onset 30s; safe in labour"},
{en:"partogram",fr:"partogramme",note:"graphical record of labour progress: cervical dilation/descent/contractions/FHR/liquor"},
// === FETAL MONITORING ===
{en:"cardiotocography (CTG / EFM)",fr:"cardiotocographie (CTG)"},
{en:"baseline fetal heart rate (FHR)",fr:"rythme cardiaque fœtal de base",note:"normal 110–160 bpm"},
{en:"FHR variability",fr:"variabilité du RCF",note:"normal 5–25 bpm; reduced variability: fetal sleep/compromise"},
{en:"acceleration",fr:"accélération (CTG)",note:">15 bpm for >15s; reassuring; confirms fetal wellbeing"},
{en:"early deceleration",fr:"décélération précoce",note:"mirrors contraction; head compression; benign"},
{en:"variable deceleration",fr:"décélération variable",note:"cord compression; most common in labour"},
{en:"late deceleration",fr:"décélération tardive",note:"uteroplacental insufficiency; concerning; may need delivery"},
{en:"prolonged deceleration",fr:"décélération prolongée",note:">2 min below baseline; acute fetal compromise"},
{en:"fetal blood sampling (FBS)",fr:"pH fœtal au scalp",note:"pH ≥7.25 normal / 7.20–7.24 borderline / <7.20 deliver"},
// === DELIVERY ===
{en:"normal / spontaneous vertex delivery",fr:"accouchement voie basse spontanée par sommet"},
{en:"episiotomy",fr:"épisiotomie",note:"mediolateral preferred; not routine"},
{en:"perineal tear grade 1",fr:"déchirure périnéale 1er degré",note:"skin only; may not need suture"},
{en:"perineal tear grade 2",fr:"déchirure périnéale 2ème degré",note:"extends into perineal muscles; suture required"},
{en:"perineal tear grade 3",fr:"déchirure périnéale 3ème degré",note:"involves external anal sphincter; OASI"},
{en:"perineal tear grade 4",fr:"déchirure périnéale 4ème degré",note:"through rectal mucosa; surgical repair; risk faecal incontinence"},
{en:"forceps delivery",fr:"accouchement aux forceps"},
{en:"ventouse / vacuum delivery",fr:"ventouse obstétricale"},
{en:"caesarean section (CS)",fr:"césarienne"},
{en:"Category 1 CS",fr:"césarienne en urgence immédiate",note:"immediate threat to life; deliver within 30 min"},
{en:"Category 2 CS",fr:"césarienne urgente"},
{en:"VBAC (vaginal birth after caesarean)",fr:"accouchement voie basse après césarienne (AVAC)"},
// === COMPLICATIONS ===
{en:"miscarriage / spontaneous abortion",fr:"fausse couche / avortement spontané",note:"<24 weeks; threatened/inevitable/complete/incomplete/missed"},
{en:"ectopic pregnancy",fr:"grossesse extra-utérine (GEU)",note:"95% Fallopian tube; BHCG+USS; medical (methotrexate) or surgical"},
{en:"pre-eclampsia",fr:"pré-éclampsie",note:"BP ≥140/90 + proteinuria after 20 weeks; early = <34w / late ≥34w"},
{en:"eclampsia",fr:"éclampsie",note:"pre-eclampsia + seizures; magnesium sulfate 4g loading then 1g/h"},
{en:"HELLP syndrome",fr:"syndrome HELLP",note:"Haemolysis/Elevated Liver enzymes/Low Platelets; severe pre-eclampsia variant"},
{en:"gestational diabetes mellitus (GDM)",fr:"diabète gestationnel",note:"OGTT at 24–28w; target: FBG <5.3 / 1h <7.8 / 2h <6.4 mmol/L"},
{en:"placenta praevia",fr:"placenta praevia",note:"placenta covers internal os; painless bleeding; no VE; CS mandatory"},
{en:"placental abruption",fr:"hématome rétroplacentaire (HRP)",note:"painful dark bleeding; uterine hypertonicity; fetal compromise; emergency"},
{en:"cord prolapse",fr:"procidence du cordon",note:"emergency; knee-chest position; manual elevation; immediate CS"},
{en:"shoulder dystocia",fr:"dystocie des épaules",note:"McRoberts manoeuvre + suprapubic pressure first; HELPERR mnemonic"},
{en:"postpartum haemorrhage (PPH)",fr:"hémorragie du post-partum (HPP)",note:">500mL vaginal / >1000mL CS; 4 Ts: tone/trauma/tissue/thrombin"},
{en:"uterine atony",fr:"atonie utérine",note:"most common PPH cause; bimanual massage + oxytocin+ergometrine+misoprostol"},
{en:"amniotic fluid embolism (AFE)",fr:"embolie amniotique",note:"catastrophic; cardiovascular collapse + DIC; supportive treatment only"},
{en:"VTE in pregnancy",fr:"thromboembolie veineuse pendant la grossesse",note:"DVT/PE; LMWH treatment; continue until 6 weeks postpartum"},
// === POSTNATAL CARE ===
{en:"postpartum period (puerperium)",fr:"post-partum / période puerpérale"},
{en:"uterine involution",fr:"involution utérine",note:"returns to pre-pregnancy size by 6 weeks; fundus descends 1cm/day"},
{en:"lochia rubra",fr:"lochies rouges",note:"days 1–3; bright red"},
{en:"lochia serosa",fr:"lochies séreuses",note:"days 4–10; pink/brown"},
{en:"lochia alba",fr:"lochies blanches",note:"weeks 2–6; white/yellow"},
{en:"breastfeeding",fr:"allaitement maternel"},
{en:"latching",fr:"prise du sein / mise au sein"},
{en:"colostrum",fr:"colostrum",note:"first milk; days 1–3; immunoglobulin-rich"},
{en:"mastitis",fr:"mastite",note:"unilateral engorgement/erythema/fever; continue breastfeeding; flucloxacillin"},
{en:"Edinburgh Postnatal Depression Scale (EPDS)",fr:"échelle d'Édimbourg (EPDS)",note:"score ≥12 = probable PPD; screen at 6–8 weeks"},
{en:"postnatal depression (PPD)",fr:"dépression du post-partum",note:"onset <4 weeks; 10–15%; SSRIs safe in breastfeeding (sertraline)"},
{en:"puerperal psychosis",fr:"psychose puerpérale",note:"rapid onset 24–72h; hallucinations/mania; psychiatric emergency"},
{en:"baby blues",fr:"blues du post-partum",note:"days 3–5; transient tearfulness; resolves spontaneously"},
]},

{id:"pediatrics", label:"Paediatrics", icon:"👶", items:[

{en:"neonate / newborn",fr:"nouveau-né",note:"0–28 days"},
{en:"infant",fr:"nourrisson",note:"28 days – 2 years"},
{en:"toddler",fr:"jeune enfant / bambin",note:"1–3 years"},
{en:"child",fr:"enfant",note:"3–12 years"},
{en:"adolescent",fr:"adolescent",note:"12–18 years"},
{en:"premature / preterm",fr:"prématuré",note:"<37 weeks; extremely preterm <28w"},
{en:"full-term",fr:"à terme",note:"37–42 weeks"},
{en:"post-term",fr:"post-terme",note:">42 weeks"},
{en:"low birth weight (LBW)",fr:"faible poids de naissance",note:"<2500g; very low <1500g; extremely low <1000g"},
{en:"Apgar score",fr:"score d'Apgar",note:"1 and 5 min; appearance/pulse/grimace/activity/respiration; 0–10"},
{en:"Ballard score",fr:"score de Ballard",note:"neonatal gestational age assessment; neuromuscular + physical maturity"},

{en:"developmental milestones",fr:"jalons / étapes du développement"},
{en:"gross motor milestones",fr:"motricité globale",note:"holds head 3m / sits 6m / stands 9–10m / walks 12m / runs 18m"},

{en:"neonatal jaundice / hyperbilirubinemia",fr:"ictère néonatal / hyperbilirubinémie",note:"physiological peak day 3–4; pathological if day 1 or conjugated"},
{en:"phototherapy (bili-light)",fr:"photothérapie (lampe à lumière bleue)"},
{en:"neonatal respiratory distress syndrome (RDS)",fr:"maladie des membranes hyalines (MMH)",note:"surfactant deficiency; preterm; surfactant replacement therapy"},
{en:"transient tachypnoea of the newborn (TTN)",fr:"tachypnée transitoire du nouveau-né",note:"'wet lung'; term/near-term; resolves 24–48h"},
{en:"meconium aspiration syndrome (MAS)",fr:"syndrome d'inhalation de méconium",note:"post-term; respiratory distress; pneumonitis"},
{en:"necrotising enterocolitis (NEC)",fr:"entérocolite ulcéro-nécrosante (ECUN)",note:"preterm; bloody stools + abdominal distension; Bell staging"},

{en:"neonatal hypoglycaemia",fr:"hypoglycémie néonatale",note:"BG <2.6 mmol/L; early feeding; IV dextrose if severe"},
{en:"neonatal seizure",fr:"convulsion néonatale",note:"subtle/tonic/clonic/myoclonic; phenobarbitone first-line"},
{en:"neonatal infection / sepsis",fr:"infection / sepsis néonatal",note:"early onset (<72h): GBS/E.coli; late onset (>72h): Staph epidermidis"},
// === INFANCY & CHILDHOOD CONDITIONS ===
{en:"bronchiolitis",fr:"bronchiolite",note:"RSV mainly; <2 years; wheeze+crackles; O2/hydration; nebulised saline"},
{en:"croup (laryngotracheobronchitis)",fr:"laryngite sous-glottique / croup",note:"barking cough + inspiratory stridor + hoarse voice; dexamethasone ± nebulised epinephrine"},
{en:"pertussis (whooping cough)",fr:"coqueluche",note:"Bordetella; paroxysmal cough + whoop + vomiting; azithromycin; notifiable disease"},
{en:"intussusception",fr:"invagination intestinale aiguë (IIA)",note:"6m–2y; intermittent colicky pain + current jelly stools; USS; air enema reduction"},
{en:"pyloric stenosis",fr:"sténose hypertrophique du pylore",note:"2–8 weeks; projectile non-bilious vomiting; olive mass; USS; Ramstedt pyloromyotomy"},
{en:"febrile seizure",fr:"convulsion fébrile",note:"6m–5y; >38°C; simple <15min / complex >15min; low risk of epilepsy"},
{en:"urinary tract infection (UTI) in children",fr:"infection urinaire chez l'enfant",note:"MSU; trimethoprim 3–7 days; refer if <2y or recurrent"},
{en:"otitis media (AOM)",fr:"otite moyenne aiguë (OMA)",note:"most common in <2y; S.pneumoniae; amoxicillin; watch and wait if >2y"},
{en:"tonsillitis",fr:"amygdalite",note:"FeverPAIN/Centor score; bacterial if score ≥4 → phenoxymethylpenicillin"},
{en:"childhood asthma",fr:"asthme de l'enfant",note:"wheeze/cough/dyspnoea; GINA stepwise; salbutamol PRN; preventer ICS"},
{en:"atopic dermatitis (eczema)",fr:"dermatite atopique",note:"pruritic rash in flexures; emollients + topical steroids; triggers"},
{en:"type 1 diabetes (childhood)",fr:"diabète de type 1 chez l'enfant",note:"polyuria/polydipsia/weight loss; DKA presentation common; insulin pump/basal-bolus"},
{en:"failure to thrive (FTT)",fr:"retard de croissance / stagnation pondérale",note:"weight <3rd centile or crossing ≥2 centile lines; organic vs non-organic"},
{en:"congenital heart disease",fr:"cardiopathie congénitale",note:"VSD/ASD/TOF/CoA/TGA/AS; antenatal USS; ECHO confirms"},
{en:"congenital defect / malformation",fr:"malformation congénitale",note:"1% of newborns; chromosomal / single gene / multifactorial / teratogen"},
// === NEURODEVELOPMENTAL CONDITIONS ===
{en:"autism spectrum disorder (ASD)",fr:"trouble du spectre de l'autisme (TSA)",note:"DSM-5 levels 1–3; social communication deficit + restricted behaviours"},
{en:"ADHD (attention deficit hyperactivity disorder)",fr:"trouble déficit de l'attention avec/sans hyperactivité (TDA/H)",note:"inattentive/hyperactive/combined; methylphenidate / behavioural therapy"},
{en:"intellectual disability",fr:"déficience intellectuelle",note:"IQ <70 + adaptive behaviour deficit; mild/moderate/severe/profound"},
{en:"cerebral palsy",fr:"paralysie cérébrale (IMC)",note:"spastic (most common)/dyskinetic/ataxic; GMFCS I–V"},
{en:"dyslexia",fr:"dyslexie",note:"specific reading difficulty; phonological processing deficit"},
{en:"dyspraxia / developmental coordination disorder",fr:"dyspraxie / trouble développemental de la coordination",note:"clumsy child; OT assessment"},
{en:"epilepsy (childhood)",fr:"épilepsie de l'enfant",note:"absence epilepsy (petit mal) / childhood epilepsy with centrotemporal spikes / juvenile myoclonic"},

{en:"vaccination schedule (France)",fr:"calendrier vaccinal (France)",note:"BCG/HepB/DTCaP-Hib-Polio/PCV13/MenC/MMR/Varicella/HPV/COVID-19"},
{en:"BCG vaccine",fr:"vaccin BCG",note:"tuberculosis; neonatal in France (high-risk); intradermal injection"},
{en:"DTaP (diphtheria-tetanus-pertussis)",fr:"vaccin DTP coqueluche acellulaire",note:"3 primary doses 2/4/11 months in France; booster every 10 years"},
{en:"MMR vaccine",fr:"vaccin ROR",note:"12 months + 16–18 months in France; live attenuated; CI in immunocompromised"},
{en:"varicella vaccine",fr:"vaccin varicelle",note:"2 doses; 12–24 months; healthcare workers non-immune"},
{en:"HPV vaccine",fr:"vaccin HPV (Gardasil 9)",note:"boys and girls 11–14 years in France; 2 doses"},
